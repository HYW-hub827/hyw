'use strict';

/* ---------------------------------------------------------------------------
   Life: continuous rain, courtyard splashes, automatic doors, traffic lights,
   the occasional tired fluorescent flicker and the slow pulse of neon.
--------------------------------------------------------------------------- */

function doorOpenAt(t) {
  const cycle = 26.0;
  const p = ((t % cycle) + cycle) % cycle;
  if (p < 6.0) return 0;
  if (p < 8.2) return easeInOutCubic(clamp((p - 6.0) / 2.2, 0, 1));
  if (p < 12.8) return 1;
  if (p < 15.0) return 1 - easeInOutCubic(clamp((p - 12.8) / 2.2, 0, 1));
  return 0;
}

function signFlickerAt(t) {
  let b = 1.0 + 0.012 * Math.sin(t * 17.3) + 0.006 * Math.sin(t * 39.1 + 1.2);
  const cycle = t % 31.0;
  // One brief tired-tube stutter, then it recovers.
  if (cycle > 20.4 && cycle < 20.9) {
    const x = (cycle - 20.4) / 0.5;
    b *= 0.52 + 0.48 * Math.abs(Math.sin(x * PI * 4.8));
  }
  if (cycle > 21.35 && cycle < 21.5) b *= 0.82;
  return b;
}

function trafficPhaseAt(t) {
  const cycle = t % 24.0;
  let car = 0;
  let carColor = '#6fe4b8';
  let pedColor = '#79e4b5';
  let pedOn = true;
  let flash = false;
  if (cycle < 10.0) {
    car = 0;
    carColor = '#64ddb2';
    pedColor = '#6fe3b3';
    pedOn = true;
    // Pedestrian flash during the last 2.6 seconds of the walk phase.
    if (cycle > 7.4) {
      flash = Math.sin((cycle - 7.4) * 10.5) > -0.15;
      pedOn = flash;
    }
  } else if (cycle < 12.8) {
    car = 1;
    carColor = '#f1c55b';
    pedOn = false;
    pedColor = '#e16255';
  } else {
    car = 2;
    carColor = '#e96157';
    pedOn = false;
    pedColor = '#e16255';
  }
  return { car, carColor, pedOn, pedColor, flash };
}

function outsideBuildings(x, z) {
  if (x > -4.25 && x < 2.25 && z > -5.25 && z < 1.75) return false; // store & canopy
  if (x > -7.15 && x < -5.18 && z > -7.0 && z < -0.62) return false; // neighbour
  return true;
}

function splashSurfaceY(x, z) {
  // Raised pavement? The little square base has three sidewalk plates.
  if (x >= -7 && x <= 4.45 && z >= -7 && z <= 2.75) return 0.176;
  if (x >= -7 && x <= 7 && z >= 5.25 && z <= 7) return 0.176;
  if (x >= 6.55 && x <= 7 && z >= -7 && z <= 5.25) return 0.176;
  return 0.036;
}

function isInAlley(x, z) {
  return x > -5.2 && x < -4.0 && z > -5.0 && z < 0.55;
}

function buildEffects(ctx) {
  ctx.doorOpen = doorOpenAt;
  ctx.signFlicker = signFlickerAt;
  ctx.trafficPhase = trafficPhaseAt;

  // A couple of faint pulses on practical lights.
  for (const g of ctx.glows) {
    // All the warm signbox blooms share the tired-tube flicker.
    if (g.pos[1] > 3.0 && g.pos[1] < 3.7 && g.pos[0] > -3.4 && g.pos[0] < 3.0) {
      g.pulse = (t) => 0.7 + 0.3 * signFlickerAt(t);
    } else if (g.pos[1] < 2.2 && g.pos[1] > 0.9 && g.color === '#83ddea') {
      g.pulse = (t) => 0.92 + 0.08 * Math.sin(t * 2.3 + 1.1);
    }
  }

  // Rain particles. Rejected inside the shop and the neighbouring building,
  // so no rain appears to fall through a roof.
  const rainSeeds = [];
  const rainShapes = [];
  const rnd = mulberry32(8821);
  let guard = 0;
  while (rainSeeds.length < 1800 * 4 && guard < 50000) {
    guard++;
    const x = -7.05 + rnd() * 14.1;
    const z = -7.05 + rnd() * 14.1;
    if (!outsideBuildings(x, z)) continue;
    const phase = rnd();
    const speed = 0.56 + rnd() * 0.42;
    rainSeeds.push(x, z, phase, speed);
    rainShapes.push(0.18 + rnd() * 0.38, 0.006 + rnd() * 0.009);
  }
  ctx.rain = {
    seeds: new Float32Array(rainSeeds),
    shapes: new Float32Array(rainShapes),
    count: rainShapes.length / 2,
  };

  // Impact ripples on the wet ground.
  const splashSeeds = [];
  const splashParams = [];
  const srnd = mulberry32(3121);
  guard = 0;
  let splashCount = 0;
  while (splashCount < 370 && guard < 30000) {
    guard++;
    const x = -7.05 + srnd() * 14.1;
    const z = -7.05 + srnd() * 14.1;
    if (!outsideBuildings(x, z)) continue;
    if (x > 2.1 && x < 4.5 && z > -2.0 && z < 1.6) {
      // A few extra sparkles near the bicycle parking puddles.
      if (srnd() > 0.4) continue;
    }
    const y = splashSurfaceY(x, z);
    splashSeeds.push(x, z, srnd(), 0.65 + srnd() * 0.7);
    splashParams.push(0.19 + srnd() * 0.22, y);
    splashCount++;
  }
  // Extra ripples under the canopy drips, in time with the falling droplets.
  for (const d of ctx.drips) {
    if (d.drop > 2.0) {
      splashSeeds.push(d.x + 0.05, d.z + 0.08, (d.phase + 0.7) % 1, 0.55);
      splashParams.push(0.18, 0.176);
    }
  }
  ctx.splash = {
    seeds: new Float32Array(splashSeeds),
    params: new Float32Array(splashParams),
    count: splashParams.length / 2,
  };

  // Soft, baked contact shadows. They are drawn as ordinary alpha decals on
  // the ground and are what stops the props from looking pasted onto the base.
  function shadow(x, z, w, d, alpha, y = 0.168, rot = 0) {
    ctx.decals.groundLabel(x, y, z, w, d, rot, 'shadowSoft', '#000000', alpha);
  }
  shadow(-1.5, 1.2, 5.8, 0.8, 0.5, 0.1675);
  shadow(-1.0, 0.78, 6.0, 0.4, 0.56, 0.166);
  shadow(2.3, -2.4, 0.85, 4.4, 0.35, 0.167);
  shadow(-5.55, 1.74, 1.35, 0.6, 0.58, 0.168);
  shadow(-4.55, 1.74, 1.25, 0.6, 0.52, 0.168);
  shadow(-6.82, 1.5, 1.1, 0.6, 0.42, 0.168);
  shadow(3.55, 0.38, 1.3, 0.6, 0.36, 0.169);
  shadow(2.95, -2.2, 1.15, 0.55, 0.32, 0.169);
  shadow(3.98, 2.2, 0.8, 0.8, 0.5, 0.168);
  shadow(6.7, 1.48, 1.0, 1.0, 0.5, 0.168);
  shadow(2.4, -0.62, 1.0, 0.65, 0.36, 0.168);
  shadow(-5.95, 6.08, 2.2, 1.3, 0.26, 0.169);
  shadow(-5.25, 6.16, 0.65, 0.55, 0.4, 0.169);
  shadow(-3.2, 5.36, 1.9, 0.35, 0.3, 0.168);
  shadow(4.25, 2.44, 0.45, 0.4, 0.34, 0.168);
  shadow(4.24, 1.44, 0.45, 0.4, 0.3, 0.168);
  shadow(-4.67, 0.46, 1.0, 0.6, 0.22, 0.169);
}


// ===== main.js =====
'use strict';

/* ---------------------------------------------------------------------------
   Camera, input and the animation loop. No in-scene UI: the diorama is the
   whole interface. Drag to orbit, wheel / pinch to zoom, shift-drag to pan.
--------------------------------------------------------------------------- */

class OrbitCamera {
  constructor(canvas) {
    this.canvas = canvas;
    const params = new URLSearchParams(location.search);
    const num = (name, fallback) => {
      const v = parseFloat(params.get(name));
      return Number.isFinite(v) ? v : fallback;
    };
    this.az = num('az', 0.56);
    this.el = num('el', 0.32);
    this.dist = num('r', 22.5);
    this.target = [num('tx', -0.25), num('ty', 0.9), num('tz', -0.35)];
    this.azGoal = this.az;
    this.elGoal = this.el;
    this.distGoal = this.dist;
    this.targetGoal = [...this.target];
    this.fov = num('fov', 29) * PI / 180;
    this.minDist = 8.5;
    this.maxDist = 32.0;
    this.minEl = 0.12;
    this.maxEl = 1.16;
    this.pointers = new Map();
    this.lastPinch = 0;
    this.prevMid = null;
    this.dragging = false;
    this.panning = false;
    this.last = null;
    this.eye = [0, 10, 20];
    this.right = [1, 0, 0];
    this.up = [0, 1, 0];
    this.forward = [0, 0, -1];
    this.vp = new Float32Array(16);
    this.view = new Float32Array(16);
    this.proj = new Float32Array(16);
    this._bind();
  }

  reset() {
    this.azGoal = 0.56;
    this.elGoal = 0.32;
    this.distGoal = 22.5;
    this.targetGoal = [-0.25, 0.9, -0.35];
    this.fov = 29 * PI / 180;
  }

  _bind() {
    const el = this.canvas;
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture?.(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      this.dragging = true;
      this.panning = e.button === 2 || e.button === 1 || e.shiftKey;
      this.last = { x: e.clientX, y: e.clientY, pan: this.panning };
      if (this.pointers.size === 2) {
        this.lastPinch = this._pinchDistance();
        this.prevMid = this._pinchMid();
      }
      el.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
    el.addEventListener('pointermove', (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.pointers.size >= 2) {
        const pd = this._pinchDistance();
        const mid = this._pinchMid();
        if (this.lastPinch > 0) {
          this.distGoal = clamp(this.distGoal * (this.lastPinch / pd), this.minDist, this.maxDist);
        }
        if (this.prevMid) {
          this._pan(mid.x - this.prevMid.x, mid.y - this.prevMid.y, true);
        }
        this.lastPinch = pd;
        this.prevMid = mid;
        return;
      }
      if (!this.last) {
        this.last = { x: e.clientX, y: e.clientY, pan: this.panning };
        return;
      }
      const dx = e.clientX - this.last.x;
      const dy = e.clientY - this.last.y;
      this.last = { x: e.clientX, y: e.clientY, pan: this.panning };
      if (this.panning) {
        this._pan(dx, dy, false);
      } else {
        this.azGoal -= dx * 0.0052;
        this.elGoal = clamp(this.elGoal - dy * 0.0042, this.minEl, this.maxEl);
      }
    }, { passive: false });
    const finish = (e) => {
      this.pointers.delete(e.pointerId);
      el.releasePointerCapture?.(e.pointerId);
      if (this.pointers.size === 0) {
        this.dragging = false;
        this.last = null;
        this.lastPinch = 0;
        this.prevMid = null;
        el.classList.remove('dragging');
      } else if (this.pointers.size === 1) {
        const p = [...this.pointers.values()][0];
        this.last = { x: p.x, y: p.y, pan: false };
        this.lastPinch = 0;
        this.prevMid = null;
      }
    };
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.distGoal = clamp(this.distGoal * Math.exp(e.deltaY * 0.00105), this.minDist, this.maxDist);
    }, { passive: false });
    el.addEventListener('dblclick', () => this.reset(), { passive: true });
  }

  _pinchDistance() {
    const p = [...this.pointers.values()];
    if (p.length < 2) return 0;
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  _pinchMid() {
    const p = [...this.pointers.values()];
    if (p.length < 2) return null;
    return { x: (p[0].x + p[1].x) * 0.5, y: (p[0].y + p[1].y) * 0.5 };
  }
  _pan(dx, dy, touch) {
    const factor = this.dist * (touch ? 0.0011 : 0.00062);
    const right = this.right;
    this.targetGoal[0] -= right[0] * dx * factor;
    this.targetGoal[2] -= right[2] * dx * factor;
    this.targetGoal[1] += dy * factor * 0.8;
    this.targetGoal[0] = clamp(this.targetGoal[0], -3.2, 3.2);
    this.targetGoal[1] = clamp(this.targetGoal[1], 0.55, 4.4);
    this.targetGoal[2] = clamp(this.targetGoal[2], -3.2, 3.2);
  }

  update(dt) {
    const lambda = 10.0;
    this.az = damp(this.az, this.azGoal, lambda, dt);
    this.el = damp(this.el, this.elGoal, lambda, dt);
    this.dist = damp(this.dist, this.distGoal, lambda, dt);
    for (let i = 0; i < 3; i++) this.target[i] = damp(this.target[i], this.targetGoal[i], lambda, dt);
    const ce = Math.cos(this.el);
    this.eye[0] = this.target[0] + this.dist * ce * Math.sin(this.az);
    this.eye[1] = this.target[1] + this.dist * Math.sin(this.el);
    this.eye[2] = this.target[2] + this.dist * ce * Math.cos(this.az);
    const aspect = Math.max(0.2, window.innerWidth / Math.max(1, window.innerHeight));
    m4.perspective(this.proj, this.fov, aspect, 0.1, 80);
    m4.lookAt(this.view, this.eye, this.target, [0, 1, 0]);
    m4.multiply(this.vp, this.proj, this.view);
    // Camera basis for billboards and drag panning.
    const fx = this.target[0] - this.eye[0];
    const fy = this.target[1] - this.eye[1];
    const fz = this.target[2] - this.eye[2];
    const fl = Math.hypot(fx, fy, fz) || 1;
    this.forward = [fx / fl, fy / fl, fz / fl];
    let rx = this.forward[1] * 0 - this.forward[2] * 1;
    let ry = this.forward[2] * 0 - this.forward[0] * 0;
    let rz = this.forward[0] * 1 - this.forward[1] * 0;
    const rl = Math.hypot(rx, ry, rz) || 1;
    this.right = [rx / rl, ry / rl, rz / rl];
    const ux = this.right[1] * this.forward[2] - this.right[2] * this.forward[1];
    const uy = this.right[2] * this.forward[0] - this.right[0] * this.forward[2];
    const uz = this.right[0] * this.forward[1] - this.right[1] * this.forward[0];
    this.up = [ux, uy, uz];
  }
}

function boot() {
  window.addEventListener('error', (event) => {
    document.title = 'ERROR — ' + (event.message || 'unknown');
    console.error(event.error || event.message);
  });
  const canvas = document.getElementById('stage');
  const gl = canvas.getContext('webgl2', {
    antialias: false,
    alpha: false,
    depth: true,
    stencil: false,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: true,
  });
  if (!gl) {
    document.title = 'WebGL2 not available';
    return;
  }
  const atlas = buildAtlas().finalize(gl);
  const ctx = buildScene(atlas);
  const camera = new OrbitCamera(canvas);
  const renderer = new DioramaRenderer(canvas, gl, atlas, ctx);
  window.__diorama = { gl, ctx, renderer, camera, atlas };
  // Developer convenience used by the headless framing captures.
  window.__snapView = (opts = {}) => {
    if (opts.az != null) camera.az = camera.azGoal = opts.az;
    if (opts.el != null) camera.el = camera.elGoal = opts.el;
    if (opts.r != null) camera.dist = camera.distGoal = opts.r;
    if (opts.fov != null) camera.fov = opts.fov * PI / 180;
    const tx = opts.tx ?? camera.target[0];
    const ty = opts.ty ?? camera.target[1];
    const tz = opts.tz ?? camera.target[2];
    camera.target = [tx, ty, tz];
    camera.targetGoal = [tx, ty, tz];
    camera.update(1.0);
    const t = opts.t ?? 9;
    renderer.render(t, camera, ctx.doorOpen(t));
    return canvas.toDataURL('image/png');
  };
  console.log('Diorama verts', ctx.lit.count, 'rain', ctx.rain.count, 'splashes', ctx.splash.count);

  const clockStart = performance.now();
  const params = new URLSearchParams(location.search);
  const timeOffset = parseFloat(params.get('t')) || 0;
  const still = params.get('still') === '1';
  let last = performance.now();
  let renderedFrames = 0;
  let firstFrame = true;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    const time = (now - clockStart) / 1000 + timeOffset;
    camera.update(dt);
    const doorOpen = ctx.doorOpen(time);
    // Gentle fluorescent breathing inside; the cooler is ever so slightly
    // steadier and colder.
    for (let i = 0; i < 4; i++) {
      const base = [0.96, 0.90, 0.85, 0.80][i];
      ctx.storeLights[i].intensity = base * (1.0 + 0.006 * Math.sin(time * 2.1 + i * 1.7));
    }
    ctx.storeLights[4].intensity = 1.30 * (1.0 + 0.012 * Math.sin(time * 1.31 + 0.5));
    // Traffic signal bleeds a faint colour onto the corner at night.
    if (ctx.traffic && ctx.trafficPhase) {
      const phase = ctx.trafficPhase(time);
      const lamp = ctx.traffic.carLights[phase.car];
      ctx.streetLights[3] = {
        pos: [lamp.pos[0], lamp.pos[1], lamp.pos[2] - 0.2],
        color: C(phase.carColor),
        intensity: 0.16,
        range: 4.6,
      };
    }
    renderer.render(time, camera, doorOpen);
    renderedFrames++;
    // Development hook: capture the freshly presented canvas inside the frame.
    if (params.get('capture') === '1' && renderedFrames === 1) {
      try { window.__capture = canvas.toDataURL('image/png'); } catch (e) { console.error(e); }
    }
    if (firstFrame) {
      firstFrame = false;
      if (params.get('debug') === '1') {
        const read = (fb, x, y) => {
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
          const p = new Uint8Array(4);
          gl.readPixels(Math.max(0, Math.min(canvas.width - 1, x)), Math.max(0, Math.min(canvas.height - 1, y)), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
          return [...p].join(',');
        };
        const samples = [
          read(null, canvas.width >> 1, canvas.height >> 1),
          read(null, canvas.width >> 2, canvas.height >> 2),
          read(null, (canvas.width * 3) >> 2, canvas.height >> 2),
          read(null, canvas.width >> 1, (canvas.height * 3) >> 2),
        ];
        document.body.dataset.pixels = samples.join('|');
        console.log('DEBUG_PIXELS', samples.join('|'));
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }
      document.body.dataset.ready = '1';
      window.__ready = true;
      if (still) return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  boot();
}

</script>
