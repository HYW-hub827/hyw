<script>

// ===== math.js =====
'use strict';

/* ---------------------------------------------------------------------------
   Tiny, dependency-free math layer. Column-major matrices, right-handed world,
   Y up. Angles are radians.
--------------------------------------------------------------------------- */

const PI = Math.PI;
const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const damp = (current, target, lambda, dt) => lerp(current, target, 1 - Math.exp(-lambda * dt));

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const m4 = {
  create() {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  identity(out) {
    out.fill(0);
    out[0] = out[5] = out[10] = out[15] = 1;
    return out;
  },
  copy(out, a) {
    out.set(a);
    return out;
  },
  multiply(out, a, b) {
    // out = a * b
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
    const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
    const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
    const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    for (let i = 0; i < 4; i++) {
      const b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
      out[i * 4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
      out[i * 4 + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
      out[i * 4 + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
      out[i * 4 + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    }
    return out;
  },
  perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2);
    out.fill(0);
    out[0] = f / aspect;
    out[5] = f;
    out[11] = -1;
    if (far != null) {
      const nf = 1 / (near - far);
      out[10] = (far + near) * nf;
      out[14] = 2 * far * near * nf;
    } else {
      out[10] = -1;
      out[14] = -2 * near;
    }
    return out;
  },
  ortho(out, left, right, bottom, top, near, far) {
    const lr = 1 / (left - right);
    const bt = 1 / (bottom - top);
    const nf = 1 / (near - far);
    out.fill(0);
    out[0] = -2 * lr;
    out[5] = -2 * bt;
    out[10] = 2 * nf;
    out[12] = (left + right) * lr;
    out[13] = (top + bottom) * bt;
    out[14] = (far + near) * nf;
    out[15] = 1;
    return out;
  },
  lookAt(out, eye, center, up) {
    let zx = eye[0] - center[0];
    let zy = eye[1] - center[1];
    let zz = eye[2] - center[2];
    let len = Math.hypot(zx, zy, zz);
    if (len < 1e-8) { zx = 0; zy = 0; zz = 1; len = 1; }
    zx /= len; zy /= len; zz /= len;
    let xx = up[1] * zz - up[2] * zy;
    let xy = up[2] * zx - up[0] * zz;
    let xz = up[0] * zy - up[1] * zx;
    len = Math.hypot(xx, xy, xz);
    if (len < 1e-8) {
      xx = 1; xy = 0; xz = 0;
    } else {
      xx /= len; xy /= len; xz /= len;
    }
    const yx = zy * xz - zz * xy;
    const yy = zz * xx - zx * xz;
    const yz = zx * xy - zy * xx;
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    out[15] = 1;
    return out;
  },
  translation(out, x, y, z) {
    m4.identity(out);
    out[12] = x; out[13] = y; out[14] = z;
    return out;
  },
  scale(out, x, y, z) {
    m4.identity(out);
    out[0] = x; out[5] = y; out[10] = z;
    return out;
  },
  rotationX(out, r) {
    const c = Math.cos(r), s = Math.sin(r);
    m4.identity(out);
    out[5] = c; out[6] = s; out[9] = -s; out[10] = c;
    return out;
  },
  rotationY(out, r) {
    const c = Math.cos(r), s = Math.sin(r);
    m4.identity(out);
    out[0] = c; out[2] = -s; out[8] = s; out[10] = c;
    return out;
  },
  rotationZ(out, r) {
    const c = Math.cos(r), s = Math.sin(r);
    m4.identity(out);
    out[0] = c; out[1] = s; out[4] = -s; out[5] = c;
    return out;
  },
  compose(out, tx, ty, tz, rx, ry, rz, sx = 1, sy = 1, sz = 1) {
    const a = m4.rotationX(_tmpA, rx);
    const b = m4.rotationY(_tmpB, ry);
    const c = m4.rotationZ(_tmpC, rz);
    m4.multiply(_tmpD, b, a);
    m4.multiply(_tmpE, c, _tmpD);
    // Apply scale columns, then translation.
    for (let i = 0; i < 3; i++) {
      out[i * 4] = _tmpE[i * 4] * sx;
      out[i * 4 + 1] = _tmpE[i * 4 + 1] * sx;
      out[i * 4 + 2] = _tmpE[i * 4 + 2] * sx;
      out[i * 4 + 3] = _tmpE[i * 4 + 3] * sx;
    }
    // Column-major: columns 0,1,2 scaled. Above loop is wrong dimension-wise;
    // rebuild explicitly for clarity.
    const r00 = _tmpE[0], r01 = _tmpE[1], r02 = _tmpE[2];
    const r10 = _tmpE[4], r11 = _tmpE[5], r12 = _tmpE[6];
    const r20 = _tmpE[8], r21 = _tmpE[9], r22 = _tmpE[10];
    out[0] = r00 * sx; out[1] = r01 * sx; out[2] = r02 * sx; out[3] = 0;
    out[4] = r10 * sy; out[5] = r11 * sy; out[6] = r12 * sy; out[7] = 0;
    out[8] = r20 * sz; out[9] = r21 * sz; out[10] = r22 * sz; out[11] = 0;
    out[12] = tx; out[13] = ty; out[14] = tz; out[15] = 1;
    return out;
  },
  transformPoint(out, m, x, y, z) {
    const w = m[3] * x + m[7] * y + m[11] * z + m[15];
    const iw = Math.abs(w) > 1e-9 ? 1 / w : 1;
    out[0] = (m[0] * x + m[4] * y + m[8] * z + m[12]) * iw;
    out[1] = (m[1] * x + m[5] * y + m[9] * z + m[13]) * iw;
    out[2] = (m[2] * x + m[6] * y + m[10] * z + m[14]) * iw;
    return out;
  },
  transformDir(out, m, x, y, z) {
    out[0] = m[0] * x + m[4] * y + m[8] * z;
    out[1] = m[1] * x + m[5] * y + m[9] * z;
    out[2] = m[2] * x + m[6] * y + m[10] * z;
    return out;
  },
};
const _tmpA = new Float32Array(16);
const _tmpB = new Float32Array(16);
const _tmpC = new Float32Array(16);
const _tmpD = new Float32Array(16);
const _tmpE = new Float32Array(16);

// Euler rotation matrix used by the mesh builder. R = Rz * Ry * Rx.
function rotationMatrix(out, rx, ry, rz) {
  const cx = Math.cos(rx), sx = Math.sin(rx);
  const cy = Math.cos(ry), sy = Math.sin(ry);
  const cz = Math.cos(rz), sz = Math.sin(rz);
  // Column-major R = Rz*Ry*Rx
  const m00 = cz * cy;
  const m01 = sz * cy;
  const m02 = -sy;
  const m10 = cz * sy * sx - sz * cx;
  const m11 = sz * sy * sx + cz * cx;
  const m12 = cy * sx;
  const m20 = cz * sy * cx + sz * sx;
  const m21 = sz * sy * cx - cz * sx;
  const m22 = cy * cx;
  out[0] = m00; out[1] = m01; out[2] = m02; out[3] = 0;
  out[4] = m10; out[5] = m11; out[6] = m12; out[7] = 0;
  out[8] = m20; out[9] = m21; out[10] = m22; out[11] = 0;
  out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
  return out;
}

function colorFromHex(hex) {
  let h = hex;
  if (typeof h === 'string') {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  return hex;
}

const _colorCache = new Map();
function C(hex) {
  if (Array.isArray(hex)) return hex;
  let c = _colorCache.get(hex);
  if (!c) {
    c = colorFromHex(hex);
    _colorCache.set(hex, c);
  }
  return c;
}
function mixColor(a, b, t) {
  const ca = C(a), cb = C(b);
  return [lerp(ca[0], cb[0], t), lerp(ca[1], cb[1], t), lerp(ca[2], cb[2], t)];
}
function shadeColor(c, k) {
  const cc = C(c);
  return [cc[0] * k, cc[1] * k, cc[2] * k];
}
function rgbaStr(c, alpha = 1) {
  const cc = C(c);
  return `rgba(${Math.round(cc[0] * 255)},${Math.round(cc[1] * 255)},${Math.round(cc[2] * 255)},${alpha})`;
}
function srgb(hex, alpha = 1) {
  const cc = C(hex);
  return `rgba(${Math.round(cc[0] * 255)},${Math.round(cc[1] * 255)},${Math.round(cc[2] * 255)},${alpha})`;
}


// ===== atlas.js =====
'use strict';

/* ---------------------------------------------------------------------------
   Hand-painted signage / poster / package art, rendered into one large atlas.
   Everything here is original artwork for Tsukimi Mart.
--------------------------------------------------------------------------- */

const JP_FONT = '"Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Meiryo", "MS Gothic", sans-serif';
const SERIF_FONT = '"Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif';

function rr(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function spacedText(ctx, text, x, y, spacing, align = 'left') {
  const chars = [...text];
  let total = 0;
  for (const ch of chars) total += ctx.measureText(ch).width + spacing;
  total -= spacing;
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  for (const ch of chars) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
  return total;
}

function fitText(ctx, text, x, y, maxWidth, size, font = JP_FONT, weight = 700) {
  let s = size;
  do {
    ctx.font = `${weight} ${s}px ${font}`;
    if (ctx.measureText(text).width <= maxWidth) break;
    s -= 2;
  } while (s > 10);
  ctx.fillText(text, x, y);
  return s;
}

function crescent(ctx, cx, cy, r, color, bg) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(cx + r * 0.38, cy - r * 0.18, r * 0.88, 0, TAU);
  ctx.fill();
}

function star(ctx, cx, cy, r, color, points = 4) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = -PI / 2 + (i * PI) / points;
    const rad = i % 2 ? r * 0.36 : r;
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

function paperNoise(ctx, w, h, alpha = 0.035, seed = 4) {
  const rnd = mulberry32(seed);
  for (let i = 0; i < w * h * 0.0018; i++) {
    const x = rnd() * w, y = rnd() * h;
    const a = rnd() * alpha;
    ctx.fillStyle = rnd() > 0.5 ? `rgba(30,48,52,${a})` : `rgba(255,255,245,${a})`;
    ctx.fillRect(x, y, 1 + rnd() * 2, 1 + rnd() * 2);
  }
}

function drawLogo(ctx, x, y, size, bg = '#1b5a59', ink = '#fff3d2', accent = '#f2a15f') {
  rr(ctx, x, y, size, size, size * 0.24);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,246,220,0.45)';
  ctx.lineWidth = Math.max(1, size * 0.015);
  ctx.stroke();
  crescent(ctx, x + size * 0.51, y + size * 0.5, size * 0.28, ink, bg);
  star(ctx, x + size * 0.72, y + size * 0.3, size * 0.075, accent, 4);
  star(ctx, x + size * 0.79, y + size * 0.5, size * 0.035, ink, 4);
}

function drawCup(ctx, x, y, s, body = '#fff8e8', shade = '#d8c6a4', steam = '#fff1cf') {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = steam;
  ctx.lineWidth = s * 0.035;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + s * (0.25 + i * 0.21), y - s * 0.18);
    ctx.bezierCurveTo(
      x + s * (0.14 + i * 0.21), y - s * 0.45,
      x + s * (0.38 + i * 0.21), y - s * 0.62,
      x + s * (0.27 + i * 0.21), y - s * 0.92,
    );
    ctx.stroke();
  }
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(x + s * 0.12, y);
  ctx.lineTo(x + s * 0.88, y);
  ctx.lineTo(x + s * 0.78, y + s * 0.8);
  ctx.quadraticCurveTo(x + s * 0.5, y + s * 0.95, x + s * 0.22, y + s * 0.8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = shade;
  ctx.fillRect(x + s * 0.22, y + s * 0.47, s * 0.56, s * 0.13);
  ctx.strokeStyle = body;
  ctx.lineWidth = s * 0.09;
  ctx.beginPath();
  ctx.arc(x + s * 0.89, y + s * 0.33, s * 0.22, -PI * 0.48, PI * 0.48);
  ctx.stroke();
  ctx.restore();
}

function drawCan(ctx, x, y, w, h, body, label, cap = '#dfe8e7') {
  ctx.fillStyle = cap;
  rr(ctx, x + w * 0.08, y, w * 0.84, h * 0.11, w * 0.05);
  ctx.fill();
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, '#96a7ab');
  grad.addColorStop(0.16, body);
  grad.addColorStop(0.58, label);
  grad.addColorStop(0.85, body);
  grad.addColorStop(1, '#64757b');
  ctx.fillStyle = grad;
  rr(ctx, x, y + h * 0.07, w, h * 0.9, w * 0.12);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillRect(x + w * 0.17, y + h * 0.13, w * 0.06, h * 0.73);
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.fillRect(x + w * 0.34, y + h * 0.3, w * 0.43, h * 0.28);
  ctx.fillStyle = 'rgba(25,46,53,0.68)';
  ctx.fillRect(x + w * 0.38, y + h * 0.35, w * 0.35, h * 0.05);
  ctx.fillRect(x + w * 0.38, y + h * 0.44, w * 0.25, h * 0.035);
}

function drawBottle(ctx, x, y, w, h, body, label) {
  ctx.fillStyle = body;
  rr(ctx, x + w * 0.26, y, w * 0.48, h * 0.17, w * 0.09);
  ctx.fill();
  rr(ctx, x + w * 0.18, y + h * 0.12, w * 0.64, h * 0.16, w * 0.09);
  ctx.fill();
  ctx.fillStyle = body;
  rr(ctx, x + w * 0.08, y + h * 0.25, w * 0.84, h * 0.71, w * 0.1);
  ctx.fill();
  ctx.fillStyle = label;
  rr(ctx, x + w * 0.12, y + h * 0.48, w * 0.76, h * 0.28, w * 0.035);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(x + w * 0.24, y + h * 0.3, w * 0.07, h * 0.58);
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.fillRect(x + w * 0.3, y + h * 0.55, w * 0.38, h * 0.045);
}

class TextureAtlas {
  constructor(size = 4096) {
    this.size = size;
    this.canvas = document.createElement('canvas');
    this.canvas.width = size;
    this.canvas.height = size;
    this.ctx = this.canvas.getContext('2d');
    this.specs = [];
    this.tiles = {};
    this.texture = null;
  }
  add(key, w, h, draw) {
    this.specs.push({ key, w: Math.ceil(w), h: Math.ceil(h), draw });
    return this;
  }
  finalize(gl) {
    const pad = 8;
    // Classic first-fit shelf packing, tallest shelf first. It is simple, fast
    // and keeps adjacent tiles from bleeding into each other.
    const ordered = [...this.specs].sort((a, b) => b.h - a.h);
    const rows = [];
    let nextY = pad;
    for (const spec of ordered) {
      let row = null;
      for (const candidate of rows) {
        if (spec.h <= candidate.h && candidate.x + spec.w + pad <= this.size) {
          row = candidate;
          break;
        }
      }
      if (!row) {
        if (nextY + spec.h + pad > this.size) {
          throw new Error('Texture atlas overflow at ' + spec.key);
        }
        row = { x: pad, y: nextY, h: spec.h };
        rows.push(row);
        nextY += spec.h + pad;
      }
      spec.x = row.x;
      spec.y = row.y;
      row.x += spec.w + pad;
    }
    for (const spec of this.specs) {
      if (spec.x == null) throw new Error('Unpacked atlas tile: ' + spec.key);
      const t = {
        u0: (spec.x + 1) / this.size,
        v0: (spec.y + 1) / this.size,
        u1: (spec.x + spec.w - 1) / this.size,
        v1: (spec.y + spec.h - 1) / this.size,
        w: spec.w,
        h: spec.h,
        aspect: spec.w / spec.h,
      };
      this.tiles[spec.key] = t;
    }
    // Paint.
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.size, this.size);
    for (const spec of this.specs) {
      ctx.save();
      ctx.translate(spec.x, spec.y);
      ctx.beginPath();
      ctx.rect(0, 0, spec.w, spec.h);
      ctx.clip();
      spec.draw(ctx, spec.w, spec.h);
      ctx.restore();
      // Thin gutter so mipmaps never sample a neighbour.
      ctx.strokeStyle = 'rgba(0,0,0,0.02)';
      ctx.strokeRect(spec.x + 0.5, spec.y + 0.5, spec.w - 1, spec.h - 1);
    }
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.canvas);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
    if (aniso) {
      const max = gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
      gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, max));
    }
    this.texture = tex;
    return this;
  }
  uv(key) {
    const t = this.tiles[key];
    if (!t) throw new Error('Unknown atlas tile: ' + key);
    return t;
  }
}

// ===== geometry.js =====
'use strict';

/* ---------------------------------------------------------------------------
   CPU geometry construction. Everything opaque in the diorama is baked into
   a handful of merged meshes, which keeps the scene at a very low draw count
   while allowing thousands of tiny props.
--------------------------------------------------------------------------- */

const _rot = new Float32Array(16);
const _v3a = [0, 0, 0];
const _v3b = [0, 0, 0];
const _v3c = [0, 0, 0];

class MeshBuilder {
  constructor() {
    this.pos = [];
    this.nrm = [];
    this.col = [];
    this.emi = [];
    this.out = [];
    this.grp = [];
  }
  get count() { return this.pos.length / 3; }
  _vert(x, y, z, nx, ny, nz, color, emit, outline, group) {
    this.pos.push(x, y, z);
    this.nrm.push(nx, ny, nz);
    this.col.push(color[0], color[1], color[2]);
    this.emi.push(emit);
    this.out.push(outline);
    this.grp.push(group);
    return this.pos.length / 3 - 1;
  }
  // Auto-corrects winding against supplied outward normals.
  _tri(a, b, c) {
    const P = this.pos, N = this.nrm;
    const ax = P[a * 3], ay = P[a * 3 + 1], az = P[a * 3 + 2];
    const bx = P[b * 3], by = P[b * 3 + 1], bz = P[b * 3 + 2];
    const cx = P[c * 3], cy = P[c * 3 + 1], cz = P[c * 3 + 2];
    const e1x = bx - ax, e1y = by - ay, e1z = bz - az;
    const e2x = cx - ax, e2y = cy - ay, e2z = cz - az;
    const nx = e1y * e2z - e1z * e2y;
    const ny = e1z * e2x - e1x * e2z;
    const nz = e1x * e2y - e1y * e2x;
    const vx = N[a * 3] + N[b * 3] + N[c * 3];
    const vy = N[a * 3 + 1] + N[b * 3 + 1] + N[c * 3 + 1];
    const vz = N[a * 3 + 2] + N[b * 3 + 2] + N[c * 3 + 2];
    if (nx * vx + ny * vy + nz * vz < 0) {
      const tmp = b; b = c; c = tmp;
    }
    this.idx.push(a, b, c);
  }
  _quad(p0, p1, p2, p3, n, color, opts) {
    const emit = opts.emit || 0;
    const outline = opts.outline ?? 0.014;
    const group = opts.group || 0;
    const a = this._vert(p0[0], p0[1], p0[2], n[0], n[1], n[2], color, emit, outline, group);
    const b = this._vert(p1[0], p1[1], p1[2], n[0], n[1], n[2], color, emit, outline, group);
    const c = this._vert(p2[0], p2[1], p2[2], n[0], n[1], n[2], color, emit, outline, group);
    const d = this._vert(p3[0], p3[1], p3[2], n[0], n[1], n[2], color, emit, outline, group);
    if (!this.idx) this.idx = [];
    this._tri(a, b, c);
    this._tri(a, c, d);
  }
  get indices() { return this.idx || (this.idx = []); }

  box(cx, cy, cz, sx, sy, sz, color, opts = {}) {
    const cc = C(color);
    const hx = sx / 2, hy = sy / 2, hz = sz / 2;
    const rx = opts.rx || 0, ry = opts.ry || 0, rz = opts.rz || 0;
    const hasRot = rx || ry || rz;
    if (hasRot) rotationMatrix(_rot, rx, ry, rz);
    const pts = [];
    const nrm = [];
    const corners = [];
    for (let i = 0; i < 8; i++) {
      const x = (i & 1 ? hx : -hx);
      const y = (i & 2 ? hy : -hy);
      const z = (i & 4 ? hz : -hz);
      let nx = x, ny = y, nz = z;
      if (hasRot) {
        m4.transformDir(_v3a, _rot, x, y, z);
        m4.transformDir(_v3b, _rot, x === 0 ? 0 : Math.sign(x), y === 0 ? 0 : Math.sign(y), z === 0 ? 0 : Math.sign(z));
        pts.push([cx + _v3a[0], cy + _v3a[1], cz + _v3a[2]]);
        corners.push([_v3b[0], _v3b[1], _v3b[2]]);
      } else {
        pts.push([cx + x, cy + y, cz + z]);
        corners.push([Math.sign(x), Math.sign(y), Math.sign(z)]);
      }
    }
    const emit = opts.emit || 0;
    const outline = opts.outline ?? 0.016;
    const group = opts.group || 0;
    const faceColors = opts.faceColors || null;
    const faces = [
      { idx: [1, 0, 2, 3], n: [0, 0, 1], key: 'front' },  // +z
      { idx: [4, 7, 5, 6], n: [0, 0, -1], key: 'back' },  // -z
      { idx: [5, 1, 4, 0], n: [1, 0, 0], key: 'right' },  // +x
      { idx: [0, 2, 1, 3], n: [-1, 0, 0], key: 'left' },  // -x
      { idx: [7, 6, 2, 3], n: [0, 1, 0], key: 'top' },    // +y
      { idx: [0, 4, 1, 5], n: [0, -1, 0], key: 'bottom' },// -y
    ];
    // Faces must be emitted with correct local corner ordering. Build them
    // directly from logical corners instead of relying on the table above.
    const V = pts;
    const faceList = [
      { p: [V[1], V[0], V[2], V[3]], n: [0, 0, 1], key: 'front' },  // z+
      { p: [V[4], V[7], V[5], V[6]], n: [0, 0, -1], key: 'back' },
      { p: [V[5], V[1], V[4], V[0]], n: [1, 0, 0], key: 'right' },
      { p: [V[0], V[2], V[1], V[3]], n: [-1, 0, 0], key: 'left' },
      { p: [V[7], V[6], V[2], V[3]], n: [0, 1, 0], key: 'top' },
      { p: [V[0], V[4], V[1], V[5]], n: [0, -1, 0], key: 'bottom' },
    ];
    // The logical face winding above is intentionally corrected by _tri, but
    // normals must be rotated for a rotated box.
    const nOut = [0, 0, 0];
    for (const f of faceList) {
      if (hasRot) m4.transformDir(nOut, _rot, f.n[0], f.n[1], f.n[2]);
      else { nOut[0] = f.n[0]; nOut[1] = f.n[1]; nOut[2] = f.n[2]; }
      const col = faceColors && faceColors[f.key] ? C(faceColors[f.key]) : cc;
      const a = this._vert(f.p[0][0], f.p[0][1], f.p[0][2], nOut[0], nOut[1], nOut[2], col, emit, outline, group);
      const b = this._vert(f.p[1][0], f.p[1][1], f.p[1][2], nOut[0], nOut[1], nOut[2], col, emit, outline, group);
      const c = this._vert(f.p[2][0], f.p[2][1], f.p[2][2], nOut[0], nOut[1], nOut[2], col, emit, outline, group);
      const d = this._vert(f.p[3][0], f.p[3][1], f.p[3][2], nOut[0], nOut[1], nOut[2], col, emit, outline, group);
      if (!this.idx) this.idx = [];
      this._tri(a, b, c);
      this._tri(a, c, d);
    }
    return this;
  }

  cylinder(cx, cy, cz, rTop, rBottom, height, seg, color, opts = {}) {
    const cc = C(color);
    const rx = opts.rx || 0, ry = opts.ry || 0, rz = opts.rz || 0;
    const hasRot = rx || ry || rz;
    if (hasRot) rotationMatrix(_rot, rx, ry, rz);
    const emit = opts.emit || 0;
    const outline = opts.outline ?? 0.012;
    const group = opts.group || 0;
    const hy = height / 2;
    const capTop = opts.capTop !== false;
    const capBottom = opts.capBottom !== false;
    const edges = opts.edges;
    const sideColor = edges ? C(edges) : cc;
    const place = (x, y, z) => {
      if (!hasRot) return [cx + x, cy + y, cz + z];
      m4.transformDir(_v3a, _rot, x, y, z);
      return [cx + _v3a[0], cy + _v3a[1], cz + _v3a[2]];
    };
    const placeDir = (x, y, z) => {
      if (!hasRot) return [x, y, z];
      m4.transformDir(_v3a, _rot, x, y, z);
      return [_v3a[0], _v3a[1], _v3a[2]];
    };
    if (!this.idx) this.idx = [];
    const ringCount = Math.max(3, seg);
    const topRing = [], botRing = [];
    for (let i = 0; i < ringCount; i++) {
      const a = (i / ringCount) * TAU;
      const x = Math.cos(a), z = Math.sin(a);
      const pT = place(x * rTop, hy, z * rTop);
      const pB = place(x * rBottom, -hy, z * rBottom);
      const nT = placeDir(x, 0, z);
      topRing.push({ p: pT, n: nT });
      botRing.push({ p: pB, n: nT });
    }
    for (let i = 0; i < ringCount; i++) {
      const j = (i + 1) % ringCount;
      const b0 = botRing[i], b1 = botRing[j], t0 = topRing[i], t1 = topRing[j];
      const a = this._vert(b0.p[0], b0.p[1], b0.p[2], b0.n[0], b0.n[1], b0.n[2], sideColor, emit, outline, group);
      const b = this._vert(t0.p[0], t0.p[1], t0.p[2], t0.n[0], t0.n[1], t0.n[2], sideColor, emit, outline, group);
      const c = this._vert(t1.p[0], t1.p[1], t1.p[2], t1.n[0], t1.n[1], t1.n[2], sideColor, emit, outline, group);
      const d = this._vert(b1.p[0], b1.p[1], b1.p[2], b1.n[0], b1.n[1], b1.n[2], sideColor, emit, outline, group);
      this._tri(a, b, c);
      this._tri(a, c, d);
    }
    const nTop = placeDir(0, 1, 0);
    const nBot = placeDir(0, -1, 0);
    if (capTop) {
      const center = place(0, hy, 0);
      const ci = this._vert(center[0], center[1], center[2], nTop[0], nTop[1], nTop[2], cc, emit, outline, group);
      const ring = topRing.map((p) => this._vert(p.p[0], p.p[1], p.p[2], nTop[0], nTop[1], nTop[2], cc, emit, outline, group));
      for (let i = 0; i < ringCount; i++) this._tri(ci, ring[i], ring[(i + 1) % ringCount]);
    }
    if (capBottom) {
      const center = place(0, -hy, 0);
      const ci = this._vert(center[0], center[1], center[2], nBot[0], nBot[1], nBot[2], cc, emit, outline, group);
      const ring = botRing.map((p) => this._vert(p.p[0], p.p[1], p.p[2], nBot[0], nBot[1], nBot[2], cc, emit, outline, group));
      for (let i = 0; i < ringCount; i++) this._tri(ci, ring[i], ring[(i + 1) % ringCount]);
    }
    return this;
  }

  sphere(cx, cy, cz, r, color, opts = {}) {
    const cc = C(color);
    const seg = opts.seg || 12;
    const rings = opts.rings || 8;
    const emit = opts.emit || 0;
    const outline = opts.outline ?? 0.012;
    const group = opts.group || 0;
    const sy = opts.scaleY || 1;
    const sx = opts.scaleX || 1;
    const sz = opts.scaleZ || 1;
    if (!this.idx) this.idx = [];
    const grid = [];
    for (let j = 0; j <= rings; j++) {
      const v = j / rings;
      const phi = v * PI;
      const row = [];
      for (let i = 0; i < seg; i++) {
        const u = i / seg;
        const theta = u * TAU;
        const nx = Math.sin(phi) * Math.cos(theta);
        const ny = Math.cos(phi);
        const nz = Math.sin(phi) * Math.sin(theta);
        const x = cx + nx * r * sx;
        const y = cy + ny * r * sy;
        const z = cz + nz * r * sz;
        row.push(this._vert(x, y, z, nx, ny, nz, cc, emit, outline, group));
      }
      grid.push(row);
    }
    for (let j = 0; j < rings; j++) {
      for (let i = 0; i < seg; i++) {
        const i2 = (i + 1) % seg;
        const a = grid[j][i], b = grid[j + 1][i], c = grid[j + 1][i2], d = grid[j][i2];
        this._tri(a, b, c);
        this._tri(a, c, d);
      }
    }
    return this;
  }

  torus(cx, cy, cz, R, r, color, opts = {}) {
    const cc = C(color);
    const seg = opts.seg || 20;
    const tubeSeg = opts.tubeSeg || 6;
    const emit = opts.emit || 0;
    const outline = opts.outline ?? 0.01;
    const group = opts.group || 0;
    const rx = opts.rx || 0, ry = opts.ry || 0, rz = opts.rz || 0;
    const hasRot = rx || ry || rz;
    if (hasRot) rotationMatrix(_rot, rx, ry, rz);
    if (!this.idx) this.idx = [];
    const rings = [];
    for (let i = 0; i < seg; i++) {
      const u = (i / seg) * TAU;
      const cu = Math.cos(u), su = Math.sin(u);
      const ring = [];
      for (let j = 0; j < tubeSeg; j++) {
        const v = (j / tubeSeg) * TAU;
        const cv = Math.cos(v), sv = Math.sin(v);
        let x = (R + r * cv) * cu;
        let y = (R + r * cv) * su;
        let z = r * sv;
        let nx = cv * cu, ny = cv * su, nz = sv;
        if (hasRot) {
          m4.transformDir(_v3a, _rot, x, y, z);
          m4.transformDir(_v3b, _rot, nx, ny, nz);
          x = _v3a[0]; y = _v3a[1]; z = _v3a[2];
          nx = _v3b[0]; ny = _v3b[1]; nz = _v3b[2];
        }
        ring.push(this._vert(cx + x, cy + y, cz + z, nx, ny, nz, cc, emit, outline, group));
      }
      rings.push(ring);
    }
    for (let i = 0; i < seg; i++) {
      const i2 = (i + 1) % seg;
      for (let j = 0; j < tubeSeg; j++) {
        const j2 = (j + 1) % tubeSeg;
        const a = rings[i][j], b = rings[i2][j], c = rings[i2][j2], d = rings[i][j2];
        this._tri(a, b, c);
        this._tri(a, c, d);
      }
    }
    return this;
  }

  tube(points, radius, color, opts = {}) {
    if (points.length < 2) return this;
    const cc = C(color);
    const sides = opts.sides || 5;
    const emit = opts.emit || 0;
    const outline = opts.outline ?? 0.008;
    const group = opts.group || 0;
    const rads = opts.radii || null;
    const up = new THREE_V([0, 1, 0]);
    const tangent = new THREE_V();
    const normal = new THREE_V();
    const binormal = new THREE_V();
    const rings = [];
    if (!this.idx) this.idx = [];
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const pPrev = points[Math.max(0, i - 1)];
      const pNext = points[Math.min(points.length - 1, i + 1)];
      tangent.set(pNext[0] - pPrev[0], pNext[1] - pPrev[1], pNext[2] - pPrev[2]).normalize();
      let upHint = Math.abs(tangent.y) > 0.92 ? new THREE_V(1, 0, 0) : up;
      binormal.copy(tangent).cross(upHint).normalize();
      normal.copy(binormal).cross(tangent).normalize();
      const r = rads ? rads[i] : radius;
      const ring = [];
      for (let j = 0; j < sides; j++) {
        const a = (j / sides) * TAU;
        const ca = Math.cos(a), sa = Math.sin(a);
        const nx = normal.x * ca + binormal.x * sa;
        const ny = normal.y * ca + binormal.y * sa;
        const nz = normal.z * ca + binormal.z * sa;
        ring.push(this._vert(p[0] + nx * r, p[1] + ny * r, p[2] + nz * r, nx, ny, nz, cc, emit, outline, group));
      }
      rings.push(ring);
    }
    for (let i = 0; i < rings.length - 1; i++) {
      for (let j = 0; j < sides; j++) {
        const j2 = (j + 1) % sides;
        const a = rings[i][j], b = rings[i + 1][j], c = rings[i + 1][j2], d = rings[i][j2];
        this._tri(a, b, c);
        this._tri(a, c, d);
      }
    }
    return this;
  }

  ring(cx, cy, cz, R, r, color, opts = {}) {
    return this.torus(cx, cy, cz, R, r, color, { seg: opts.seg || 24, tubeSeg: opts.tubeSeg || 5, ...opts });
  }

  plane(cx, cy, cz, sx, sz, color, opts = {}) {
    const cc = C(color);
    const n = opts.normal || [0, 1, 0];
    const y = cy;
    const points = [
      [cx - sx / 2, y, cz - sz / 2],
      [cx - sx / 2, y, cz + sz / 2],
      [cx + sx / 2, y, cz + sz / 2],
      [cx + sx / 2, y, cz - sz / 2],
    ];
    this._quad(points[0], points[1], points[2], points[3], n, cc, opts);
    return this;
  }

  line(p1, p2, radius, color, opts = {}) {
    return this.tube([p1, p2], radius, color, opts);
  }

  // A loose, slightly irregular puddle / spill patch outline.
  puddle(cx, cz, rx, rz, color, opts = {}) {
    const n = opts.segments || 18;
    const rnd = mulberry32(opts.seed || 3);
    const radii = [];
    for (let i = 0; i < n; i++) radii.push(0.78 + rnd() * 0.35);
    const y = opts.y || 0.021;
    const center = this._vert(cx, y, cz, 0, 1, 0, C(color), opts.emit || 0, 0, opts.group || 0);
    const ring = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      ring.push(this._vert(cx + Math.cos(a) * rx * radii[i], y, cz + Math.sin(a) * rz * radii[i], 0, 1, 0, C(color), opts.emit || 0, 0, opts.group || 0));
    }
    if (!this.idx) this.idx = [];
    for (let i = 0; i < n; i++) this._tri(center, ring[i], ring[(i + 1) % n]);
    return this;
  }

  // Merge another local-space builder into this one through a transform. This
  // lets complex props (bicycles, lamps, signals) be authored comfortably in
  // local coordinates and then placed freely in the diorama.
  append(other, matrix) {
    const base = this.count;
    const o = other;
    if (!this.idx) this.idx = [];
    for (let i = 0; i < o.pos.length / 3; i++) {
      const x = o.pos[i * 3], y = o.pos[i * 3 + 1], z = o.pos[i * 3 + 2];
      m4.transformPoint(_v3a, matrix, x, y, z);
      m4.transformDir(_v3b, matrix, o.nrm[i * 3], o.nrm[i * 3 + 1], o.nrm[i * 3 + 2]);
      const l = Math.hypot(_v3b[0], _v3b[1], _v3b[2]) || 1;
      this.pos.push(_v3a[0], _v3a[1], _v3a[2]);
      this.nrm.push(_v3b[0] / l, _v3b[1] / l, _v3b[2] / l);
      this.col.push(o.col[i * 3], o.col[i * 3 + 1], o.col[i * 3 + 2]);
      this.emi.push(o.emi[i]);
      this.out.push(o.out[i]);
      this.grp.push(o.grp[i]);
    }
    const oi = o.idx || [];
    for (let i = 0; i < oi.length; i++) this.idx.push(oi[i] + base);
    return this;
  }

  build() {
    return {
      position: new Float32Array(this.pos),
      normal: new Float32Array(this.nrm),
      color: new Float32Array(this.col),
      emit: new Float32Array(this.emi),
      outline: new Float32Array(this.out),
      group: new Float32Array(this.grp),
      index: new Uint32Array(this.idx || []),
      count: (this.idx || []).length,
    };
  }
}

// Tiny vector helper used only by tube frame construction.
class THREE_V {
  constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
  set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
  copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; return this; }
  cross(v) {
    const x = this.x, y = this.y, z = this.z;
    this.x = y * v.z - z * v.y;
    this.y = z * v.x - x * v.z;
    this.z = x * v.y - y * v.x;
    return this;
  }
  normalize() {
    const l = Math.hypot(this.x, this.y, this.z) || 1;
    this.x /= l; this.y /= l; this.z /= l;
    return this;
  }
}

/* ---------------------------------------------------------------------------
   Textured label batches. These carry alpha, so the same builder powers both
   opaque signs and transparent window decals.
--------------------------------------------------------------------------- */
class LabelBuilder {
  constructor(atlas) {
    this.atlas = atlas;
    this.pos = [];
    this.uv = [];
    this.col = [];
    this.alpha = [];
    this.idx = [];
    this.count = 0;
  }
  _v(x, y, z, u, v, c, a) {
    this.pos.push(x, y, z);
    this.uv.push(u, v);
    this.col.push(c[0], c[1], c[2]);
    this.alpha.push(a);
    return this.count++;
  }
  _quad(p0, p1, p2, p3, u0, v0, u1, v1, color, alpha) {
    const c = C(color);
    const a = this._v(p0[0], p0[1], p0[2], u0, v0, c, alpha);
    const b = this._v(p1[0], p1[1], p1[2], u1, v0, c, alpha);
    const cc = this._v(p2[0], p2[1], p2[2], u1, v1, c, alpha);
    const d = this._v(p3[0], p3[1], p3[2], u0, v1, c, alpha);
    this.idx.push(a, b, cc, a, cc, d);
  }
  tile(key) { return this.atlas.uv(key); }
  label(cx, cy, cz, w, h, facing, key, color = '#ffffff', alpha = 1, opts = {}) {
    const t = this.atlas.uv(key);
    const u0 = t.u0, v0 = t.v0, u1 = t.u1, v1 = t.v1;
    let p0, p1, p2, p3;
    const x0 = cx - w / 2, x1 = cx + w / 2;
    const y0 = cy + h / 2, y1 = cy - h / 2;
    if (facing === '+z') {
      p0 = [x0, y0, cz]; p1 = [x1, y0, cz]; p2 = [x1, y1, cz]; p3 = [x0, y1, cz];
    } else if (facing === '-z') {
      p0 = [x1, y0, cz]; p1 = [x0, y0, cz]; p2 = [x0, y1, cz]; p3 = [x1, y1, cz];
    } else if (facing === '+x') {
      p0 = [cx, y0, cz + w / 2]; p1 = [cx, y0, cz - w / 2]; p2 = [cx, y1, cz - w / 2]; p3 = [cx, y1, cz + w / 2];
    } else if (facing === '-x') {
      p0 = [cx, y0, cz - w / 2]; p1 = [cx, y0, cz + w / 2]; p2 = [cx, y1, cz + w / 2]; p3 = [cx, y1, cz - w / 2];
    } else if (facing === '+y') {
      p0 = [cx - w / 2, cy, cz + h / 2]; p1 = [cx + w / 2, cy, cz + h / 2];
      p2 = [cx + w / 2, cy, cz - h / 2]; p3 = [cx - w / 2, cy, cz - h / 2];
    } else if (facing === '-y') {
      p0 = [cx - w / 2, cy, cz - h / 2]; p1 = [cx + w / 2, cy, cz - h / 2];
      p2 = [cx + w / 2, cy, cz + h / 2]; p3 = [cx - w / 2, cy, cz + h / 2];
    }
    if (opts.flipX) {
      const tmp = p0; p0 = p1; p1 = tmp;
      const tmp2 = p3; p3 = p2; p2 = tmp2;
    }
    this._quad(p0, p1, p2, p3, u0, v0, u1, v1, color, alpha);
    return this;
  }
  labelCorners(corners, key, color = '#ffffff', alpha = 1) {
    const t = this.atlas.uv(key);
    this._quad(corners[0], corners[1], corners[2], corners[3], t.u0, t.v0, t.u1, t.v1, color, alpha);
    return this;
  }
  groundLabel(cx, cy, cz, w, d, rot, key, color = '#ffffff', alpha = 1) {
    const t = this.atlas.uv(key);
    const c = Math.cos(rot), s = Math.sin(rot);
    const local = [
      [-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2],
    ];
    const pts = local.map(([x, z]) => [cx + x * c - z * s, cy, cz + x * s + z * c]);
    // top edge is local -d/2
    this._quad(pts[0], pts[1], pts[2], pts[3], t.u0, t.v0, t.u1, t.v1, color, alpha);
    return this;
  }
  quadManual(p0, p1, p2, p3, u0, v0, u1, v1, color, alpha) {
    this._quad(p0, p1, p2, p3, u0, v0, u1, v1, color, alpha);
    return this;
  }
  build() {
    return {
      position: new Float32Array(this.pos),
      uv: new Float32Array(this.uv),
      color: new Float32Array(this.col),
      alpha: new Float32Array(this.alpha),
      index: new Uint32Array(this.idx),
      count: this.idx.length,
    };
  }
}

/* ---------------------------------------------------------------------------
   Simple painterly helpers for canvas textures.
--------------------------------------------------------------------------- */
function makeCanvasTexture(gl, w, h, draw, opts = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  draw(ctx, w, h);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, opts.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, opts.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
  if (aniso) {
    const max = gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
    gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, max));
  }
  return { texture: tex, canvas, ctx };
}

function makeAsphaltCanvas(size = 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const rnd = mulberry32(1234);
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = rnd();
    const n = v * 26;
    img.data[i * 4] = 35 + n * 0.72;
    img.data[i * 4 + 1] = 42 + n * 0.86;
    img.data[i * 4 + 2] = 49 + n;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // aggregate
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * size, y = rnd() * size;
    const r = 0.7 + rnd() * 2.2;
    ctx.fillStyle = rnd() > 0.56 ? `rgba(109,126,135,${0.12 + rnd() * 0.22})` : `rgba(17,23,30,${0.16 + rnd() * 0.2})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  // Broad damp patches and old patched asphalt, sized to survive mipmapping.
  for (let i = 0; i < 14; i++) {
    const x = rnd() * size, y = rnd() * size;
    const r = 35 + rnd() * 150;
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() > 0.35;
    g2.addColorStop(0, dark ? 'rgba(10,16,22,0.20)' : 'rgba(125,141,148,0.08)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  // Cracks.
  ctx.strokeStyle = 'rgba(12,18,24,0.35)';
  for (let i = 0; i < 8; i++) {
    let x = rnd() * size, y = rnd() * size;
    ctx.lineWidth = 0.7 + rnd() * 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    const n = 3 + Math.floor(rnd() * 5);
    for (let k = 0; k < n; k++) {
      x += (rnd() - 0.5) * 70;
      y += (rnd() - 0.5) * 70;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // long wet streaks
  for (let i = 0; i < 22; i++) {
    const grad = ctx.createLinearGradient(0, rnd() * size, 0, rnd() * size + 130);
    grad.addColorStop(0, 'rgba(13,20,26,0)');
    grad.addColorStop(0.5, `rgba(12,19,26,${0.1 + rnd() * 0.12})`);
    grad.addColorStop(1, 'rgba(13,20,26,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(rnd() * size, 0, 8 + rnd() * 40, size);
  }
  return canvas;
}

function makePaverCanvas(size = 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const rnd = mulberry32(443);
  ctx.fillStyle = '#444d53';
  ctx.fillRect(0, 0, size, size);
  const tileW = size / 4;
  const tileH = size / 4;
  for (let row = 0; row < 4; row++) {
    for (let col = -1; col < 5; col++) {
      const x = col * tileW + (row % 2) * tileW * 0.5;
      const y = row * tileH;
      const v = 61 + rnd() * 19;
      ctx.fillStyle = `rgb(${v + 2},${v + 7},${v + 12})`;
      ctx.fillRect(x + 3, y + 3, tileW - 6, tileH - 6);
      // subtle per-paver wear
      for (let k = 0; k < 7; k++) {
        ctx.fillStyle = `rgba(22,31,38,${rnd() * 0.09})`;
        ctx.fillRect(x + 4 + rnd() * (tileW - 12), y + 4 + rnd() * (tileH - 12), 2 + rnd() * 22, 1 + rnd() * 4);
      }
    }
  }
  // dark gutter / moss in the joints
  ctx.fillStyle = 'rgba(24,31,34,0.4)';
  for (let row = 0; row < 8; row++) ctx.fillRect(0, row * tileH + tileH - 2, size, 2);
  for (let col = 0; col < 5; col++) ctx.fillRect(col * tileW, 0, 2, size);
  return canvas;
}

function makeInteriorFloorCanvas(size = 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const rnd = mulberry32(890);
  ctx.fillStyle = '#b7a88b';
  ctx.fillRect(0, 0, size, size);
  const grid = 8;
  const cell = size / grid;
  for (let y = 0; y < grid; y++) {
    for (let x = 0; x < grid; x++) {
      const v = 192 + rnd() * 18;
      ctx.fillStyle = `rgb(${v},${v - 15},${v - 34})`;
      ctx.fillRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4);
      ctx.fillStyle = `rgba(255,244,210,${0.03 + rnd() * 0.04})`;
      ctx.fillRect(x * cell + 4, y * cell + 4, cell * 0.4, 2);
    }
  }
  // green wayfinding inlay
  ctx.fillStyle = '#5f8d75';
  ctx.fillRect(size * 0.55, 0, 8, size);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(0, 0, size, size * 0.04);
  return canvas;
}

'use strict';

/* ---------------------------------------------------------------------------
   Shaders. The look is a stylised cel/toon render: banded moonlight, warm
   pooled interior light, ink outlines, wet neon reflections and a soft bloom.
--------------------------------------------------------------------------- */

const SHADERS = {};

SHADERS.fullscreenVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aClip;

precision highp float;
in vec3 vWorld;
in vec3 vNormal;
in vec3 vColor;
in float vEmit;
in float vGroup;
uniform vec3 uCamPos;
uniform vec3 uMoonDir;
uniform vec3 uMoonColor;
uniform vec3 uSkyAmbient;
uniform vec3 uGroundAmbient;
uniform vec3 uInteriorAmbient;
uniform vec3 uRimColor;
uniform vec3 uFogColor;
uniform vec4 uStoreLights[5];       // xyz position, w range
uniform vec4 uStoreLightColors[5];  // rgb colour, w intensity
uniform vec4 uStreetLights[6];      // xyz position, w range
uniform vec4 uStreetLightColors[6]; // rgb colour, w intensity
uniform float uTime;
out vec4 outColor;

float hash21(vec2 p){
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

vec3 pointContribution(vec3 N, vec3 world, vec3 V, vec4 light, vec4 col, float specStrength){
  vec3 delta = light.xyz - world;
  float dist = length(delta);
  if (dist > light.w || dist < 0.001) return vec3(0.0);
  vec3 L = delta / dist;
  float atten = pow(clamp(1.0 - dist / light.w, 0.0, 1.0), 1.9);
  float ndl = dot(N, L);
  // Banded diffuse with a tiny amount of continuous shading to keep facets alive.
  float band = smoothstep(-0.06, 0.10, ndl) * 0.62 + smoothstep(0.42, 0.56, ndl) * 0.26 + smoothstep(0.82, 0.92, ndl) * 0.12;
  vec3 diffuse = col.rgb * atten * band * col.w;
  vec3 H = normalize(L + V);
  float spec = pow(max(dot(N, H), 0.0), 30.0) * atten * col.w * specStrength;
  return diffuse + col.rgb * spec * 0.55;
}

void main(){
  vec3 N = normalize(vNormal);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(uCamPos - vWorld);
  vec3 base = vColor;
  vec3 light = vec3(0.0);
  float interior = step(0.5, vGroup);

  // A quiet sky/ground gradient. Interior is bathed in warm fluorescent light.
  float hemi = N.y * 0.5 + 0.5;
  vec3 exteriorAmbient = mix(uGroundAmbient, uSkyAmbient, hemi);
  vec3 warmCeiling = mix(vec3(0.64, 0.56, 0.46), vec3(1.10, 0.95, 0.72), hemi);
  vec3 ambient = mix(exteriorAmbient, uInteriorAmbient * warmCeiling, interior);
  light += ambient;

  // Moonlight, gathered into broad cel bands on the dark side of the model.
  vec3 moonDir = normalize(uMoonDir);
  float moonNdl = clamp(dot(N, moonDir), 0.0, 1.0);
  float moonBand = smoothstep(0.015, 0.075, moonNdl) * 0.34 + smoothstep(0.38, 0.46, moonNdl) * 0.33 + smoothstep(0.74, 0.80, moonNdl) * 0.33;
  light += uMoonColor * moonBand * (1.0 - interior * 0.72);

  // Interior fluorescent point lights.
  for (int i = 0; i < 5; i++) {
    light += pointContribution(N, vWorld, V, uStoreLights[i], uStoreLightColors[i], 0.18) * interior;
  }
  // Exterior sodium / neon / vending spill.
  for (int i = 0; i < 6; i++) {
    light += pointContribution(N, vWorld, V, uStreetLights[i], uStreetLightColors[i], 0.9) * (1.0 - interior * 0.8);
  }

  // Cool rim that catches rain-wet silhouettes.
  float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.2);
  light += uRimColor * fres * mix(0.42, 0.10, interior);

  // Subtle noise in the shadows keeps flat colours from looking like plastic.
  float grain = hash21(gl_FragCoord.xy * 0.37 + vWorld.xz * 3.2) - 0.5;
  light += grain * 0.012;

  vec3 color = base * light;
  color += base * vEmit * 2.35;

  // Warm interior light bleeding onto the frames of the store itself.
  if (interior < 0.5 && vEmit < 0.1) {
    float storeGlow = 1.0 - smoothstep(2.0, 6.4, distance(vWorld.xz, vec2(-0.8, 1.4)));
    color += base * vec3(1.0, 0.64, 0.30) * storeGlow * 0.12;
    color += base * vec3(0.18, 0.32, 0.38) * (1.0 - storeGlow) * 0.05;
  }

  // Gentle distance haze helps the miniature settle into its dark display void.
  float dist = distance(vWorld, uCamPos);
  float fog = 1.0 - exp(-max(dist - 16.0, 0.0) * 0.026);
  color = mix(color, uFogColor, clamp(fog, 0.0, 0.36));

  outColor = vec4(color, 1.0);
}`;

SHADERS.puddleFS = `#version 300 es
precision highp float;
in vec3 vWorld;
uniform vec3 uCamPos;
uniform float uTime;
uniform vec3 uFogColor;
out vec4 outColor;

float hash21(vec2 p){
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}
float rippleLayer(vec2 p, float t, float scale, float density){
  p *= scale;
  vec2 id = floor(p);
  vec2 f = fract(p) - 0.5;
  float h = hash21(id);
  if (h > density) return 0.0;
  float life = fract(t * (0.26 + h * 0.2) + h * 7.0);
  float radius = life * 0.82;
  float ring = smoothstep(0.045, 0.007, abs(length(f) - radius));
  float fade = (1.0 - life) * smoothstep(0.0, 0.14, life);
  return ring * fade;
}

void main(){
  vec3 V = normalize(uCamPos - vWorld);
  float fres = pow(1.0 - clamp(V.y, 0.0, 1.0), 2.1);
  vec2 p = vWorld.xz;
  float r1 = rippleLayer(p + vec2(uTime * 0.015, -uTime * 0.008), uTime, 3.6, 0.55);
  float r2 = rippleLayer(p * 1.6 + 7.3 + vec2(-uTime * 0.01, uTime * 0.014), uTime * 1.31, 5.1, 0.38);
  float ripple = clamp(r1 + r2, 0.0, 1.0);

  float bands = sin(p.x * 4.2 + p.y * 2.1 + uTime * 0.55) * 0.5 + 0.5;
  bands = pow(bands, 3.0);

  vec3 nightSky = vec3(0.12, 0.21, 0.26);
  vec3 color = mix(vec3(0.015, 0.032, 0.045), nightSky, 0.46 + fres * 0.42);
  color += vec3(0.34, 0.52, 0.60) * bands * 0.055;
  color += vec3(0.55, 0.78, 0.92) * ripple * 0.95;
  color += vec3(0.72, 0.55, 0.30) * smoothstep(2.5, 8.0, p.y) * 0.05;
  color += vec3(0.65, 0.78, 0.82) * pow(fres, 4.0) * 0.18;
  float alpha = 0.49 + fres * 0.28 + ripple * 0.27;

  float dist = distance(vWorld, uCamPos);
  if (dist > 23.0) alpha *= 0.8;
  outColor = vec4(color, alpha);
}`;
