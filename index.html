// ===== renderer.js =====
'use strict';

/* ---------------------------------------------------------------------------
   WebGL2 renderer: merged geometry, inverted-hull ink outlines, transparent
   glass, animated rain, painterly ground light and a small HDR bloom chain.
--------------------------------------------------------------------------- */

const ATTR = {
  pos: 0, normal: 1, color: 2, emit: 3, outline: 4, group: 5,
  uv: 1, alpha: 3,
};

function compileShader(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    console.error('Shader compile error:', log, src);
    throw new Error('Shader compile error: ' + log);
  }
  return sh;
}

function createProgram(gl, vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl, gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compileShader(gl, gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    console.error('Program link error:', log);
    throw new Error('Program link error: ' + log);
  }
  const cache = new Map();
  return {
    program: p,
    use() { gl.useProgram(p); },
    u(name) {
      if (!cache.has(name)) cache.set(name, gl.getUniformLocation(p, name));
      return cache.get(name);
    },
  };
}

function createBuffer(gl, target, data, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(target, b);
  gl.bufferData(target, data, usage || gl.STATIC_DRAW);
  return b;
}

class GroundBuilder {
  constructor() { this.pos = []; this.uv = []; this.idx = []; this.count = 0; }
  addQuad(x0, z0, x1, z1, y, uRepeat = 1, vRepeat = 1) {
    const a = this.count;
    this.pos.push(
      x0, y, z0, x0, y, z1, x1, y, z1, x1, y, z0,
    );
    this.uv.push(0, 0, 0, vRepeat, uRepeat, vRepeat, uRepeat, 0);
    this.idx.push(a, a + 1, a + 2, a, a + 2, a + 3);
    this.count += 4;
  }
  build() {
    return {
      position: new Float32Array(this.pos),
      uv: new Float32Array(this.uv),
      index: new Uint32Array(this.idx),
      count: this.idx.length,
    };
  }
}

class PuddleBuilder {
  constructor() { this.pos = []; this.idx = []; this.count = 0; }
  add(cx, cz, rx, rz, y, seed = 1, segments = 22) {
    const rnd = mulberry32(seed);
    const a = this.count;
    this.pos.push(cx, y, cz);
    for (let i = 0; i < segments; i++) {
      const ang = (i / segments) * TAU;
      const jitter = 0.78 + rnd() * 0.32;
      this.pos.push(cx + Math.cos(ang) * rx * jitter, y, cz + Math.sin(ang) * rz * jitter);
    }
    for (let i = 0; i < segments; i++) {
      this.idx.push(a, a + 1 + ((i + 1) % segments), a + 1 + i);
    }
    this.count += segments + 1;
  }
  build() {
    return {
      position: new Float32Array(this.pos),
      index: new Uint32Array(this.idx),
      count: this.idx.length,
    };
  }
}

class GlassBuilder {
  constructor() { this.pos = []; this.uv = []; this.nrm = []; this.idx = []; this.count = 0; }
  pane(cx, cy, cz, w, h, facing = '+z', uRep = 1, vRep = 1) {
    const a = this.count;
    let p = [], n = [0, 0, 1];
    if (facing === '+z') {
      p = [[cx - w / 2, cy + h / 2, cz], [cx + w / 2, cy + h / 2, cz], [cx + w / 2, cy - h / 2, cz], [cx - w / 2, cy - h / 2, cz]];
      n = [0, 0, 1];
    } else if (facing === '-z') {
      p = [[cx + w / 2, cy + h / 2, cz], [cx - w / 2, cy + h / 2, cz], [cx - w / 2, cy - h / 2, cz], [cx + w / 2, cy - h / 2, cz]];
      n = [0, 0, -1];
    } else if (facing === '+x') {
      p = [[cx, cy + h / 2, cz + w / 2], [cx, cy + h / 2, cz - w / 2], [cx, cy - h / 2, cz - w / 2], [cx, cy - h / 2, cz + w / 2]];
      n = [1, 0, 0];
    } else if (facing === '-x') {
      p = [[cx, cy + h / 2, cz - w / 2], [cx, cy + h / 2, cz + w / 2], [cx, cy - h / 2, cz + w / 2], [cx, cy - h / 2, cz - w / 2]];
      n = [-1, 0, 0];
    }
    for (const q of p) this.pos.push(q[0], q[1], q[2]);
    this.uv.push(0, 0, uRep, 0, uRep, vRep, 0, vRep);
    for (let i = 0; i < 4; i++) this.nrm.push(n[0], n[1], n[2]);
    this.idx.push(a, a + 1, a + 2, a, a + 2, a + 3);
    this.count += 4;
    return this;
  }
  build() {
    return {
      position: new Float32Array(this.pos),
      uv: new Float32Array(this.uv),
      normal: new Float32Array(this.nrm),
      index: new Uint32Array(this.idx),
      count: this.idx.length,
    };
  }
}

class TransparentBuilder {
  constructor() { this.pos = []; this.nrm = []; this.col = []; this.alpha = []; this.idx = []; this.count = 0; }
  quad(p0, p1, p2, p3, n, color, alpha) {
    const c = C(color);
    const a = this.count;
    for (const p of [p0, p1, p2, p3]) {
      this.pos.push(p[0], p[1], p[2]);
      this.nrm.push(n[0], n[1], n[2]);
      this.col.push(c[0], c[1], c[2]);
      this.alpha.push(alpha);
    }
    this.idx.push(a, a + 1, a + 2, a, a + 2, a + 3);
    this.count += 4;
    return this;
  }
  triangle(p0, p1, p2, color, alpha) {
    const c = C(color);
    const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2];
    const bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = p2[2] - p0[2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    const a = this.count;
    for (const p of [p0, p1, p2]) {
      this.pos.push(p[0], p[1], p[2]);
      this.nrm.push(nx, ny, nz);
      this.col.push(c[0], c[1], c[2]);
      this.alpha.push(alpha);
    }
    this.idx.push(a, a + 1, a + 2);
    this.count += 3;
    return this;
  }
  build() {
    return {
      position: new Float32Array(this.pos),
      normal: new Float32Array(this.nrm),
      color: new Float32Array(this.col),
      alpha: new Float32Array(this.alpha),
      index: new Uint32Array(this.idx),
      count: this.idx.length,
    };
  }
}

class GlowDynamicBatch {
  constructor() { this.verts = []; }
  reset() { this.verts.length = 0; }
  addQuad(p0, p1, p2, p3, color, alpha) {
    const c = C(color);
    const base = this.verts.length / 9;
    const pts = [p0, p1, p2, p3];
    for (const p of pts) this.verts.push(p[0], p[1], p[2], p[3], p[4], c[0], c[1], c[2], alpha);
    this.verts.push(
      // triangles are emitted directly by the caller through indices? no:
    );
  }
  addTri(p0, p1, p2, color, alpha) {
    const c = C(color);
    for (const p of [p0, p1, p2]) this.verts.push(p[0], p[1], p[2], p[3], p[4], c[0], c[1], c[2], alpha);
  }
  addRect(corners, color, alpha) {
    this.addTri(corners[0], corners[1], corners[2], color, alpha);
    this.addTri(corners[0], corners[2], corners[3], color, alpha);
  }
}

function makeLitBatch(gl, data) {
  if (!data || data.count === 0) return null;
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const attrs = [
    { loc: 0, data: data.position, size: 3 },
    { loc: 1, data: data.normal, size: 3 },
    { loc: 2, data: data.color, size: 3 },
    { loc: 3, data: data.emit, size: 1 },
    { loc: 4, data: data.outline, size: 1 },
    { loc: 5, data: data.group, size: 1 },
  ];
  for (const a of attrs) {
    const b = createBuffer(gl, gl.ARRAY_BUFFER, a.data);
    gl.enableVertexAttribArray(a.loc);
    gl.vertexAttribPointer(a.loc, a.size, gl.FLOAT, false, 0, 0);
  }
  const ibo = createBuffer(gl, gl.ELEMENT_ARRAY_BUFFER, data.index);
  gl.bindVertexArray(null);

  // Outlines are only emitted for triangles whose vertices all request ink.
  const oi = [];
  const idx = data.index;
  for (let i = 0; i < idx.length; i += 3) {
    if (data.outline[idx[i]] > 0.0015 && data.outline[idx[i + 1]] > 0.0015 && data.outline[idx[i + 2]] > 0.0015) {
      oi.push(idx[i], idx[i + 1], idx[i + 2]);
    }
  }
  let outline = null;
  if (oi.length) {
    const vo = gl.createVertexArray();
    gl.bindVertexArray(vo);
    for (const a of attrs) {
      const b = createBuffer(gl, gl.ARRAY_BUFFER, a.data);
      gl.enableVertexAttribArray(a.loc);
      gl.vertexAttribPointer(a.loc, a.size, gl.FLOAT, false, 0, 0);
    }
    createBuffer(gl, gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(oi));
    gl.bindVertexArray(null);
    outline = { vao: vo, count: oi.length };
  }
  return { vao, count: idx.length, outline };
}

function makeIndexedBatch(gl, layout, data) {
  if (!data || data.count === 0) return null;
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  for (const a of layout) {
    const buf = createBuffer(gl, gl.ARRAY_BUFFER, data[a.key]);
    gl.enableVertexAttribArray(a.loc);
    gl.vertexAttribPointer(a.loc, a.size, gl.FLOAT, false, 0, 0);
  }
  createBuffer(gl, gl.ELEMENT_ARRAY_BUFFER, data.index);
  gl.bindVertexArray(null);
  return { vao, count: data.count };
}

function makeNonIndexedBatch(gl, layout, data) {
  if (!data || !data.position || data.position.length === 0) return null;
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  for (const a of layout) {
    const buf = createBuffer(gl, gl.ARRAY_BUFFER, data[a.key]);
    gl.enableVertexAttribArray(a.loc);
    gl.vertexAttribPointer(a.loc, a.size, gl.FLOAT, false, 0, 0);
  }
  gl.bindVertexArray(null);
  return { vao, count: data.position.length / 3 };
}

const LABEL_LAYOUT = [
  { loc: 0, key: 'position', size: 3 },
  { loc: 1, key: 'uv', size: 2 },
  { loc: 2, key: 'color', size: 3 },
  { loc: 3, key: 'alpha', size: 1 },
];
const GLOW_LAYOUT = LABEL_LAYOUT;
const TRANSPARENT_LAYOUT = [
  { loc: 0, key: 'position', size: 3 },
  { loc: 1, key: 'normal', size: 3 },
  { loc: 2, key: 'color', size: 3 },
  { loc: 3, key: 'alpha', size: 1 },
];

function createCanvasTexture(gl, w, h, draw, repeat = false, pixelArt = false) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  draw(ctx, w, h);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  if (repeat) gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, repeat ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
  return tex;
}

function makeGlowTexture(gl) {
  return createCanvasTexture(gl, 256, 256, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.09, 'rgba(255,255,255,0.94)');
    g.addColorStop(0.24, 'rgba(255,255,255,0.44)');
    g.addColorStop(0.48, 'rgba(255,255,255,0.13)');
    g.addColorStop(0.78, 'rgba(255,255,255,0.028)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
}

function makeStreakTexture(gl) {
  return createCanvasTexture(gl, 256, 1024, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const rnd = mulberry32(98);
    // Soft, broken reflection column, brightest at the top (source).
    for (let i = 0; i < 26; i++) {
      const x = w * (0.16 + rnd() * 0.68);
      const ww = 2 + rnd() * 17;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, `rgba(255,255,255,${0.0 + rnd() * 0.16})`);
      g.addColorStop(0.08, `rgba(255,255,255,${0.16 + rnd() * 0.26})`);
      g.addColorStop(0.36, `rgba(255,255,255,${0.04 + rnd() * 0.12})`);
      g.addColorStop(0.75, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x, 0, ww, h * (0.45 + rnd() * 0.5));
    }
    const core = ctx.createLinearGradient(0, 0, 0, h);
    core.addColorStop(0, 'rgba(255,255,255,0.5)');
    core.addColorStop(0.22, 'rgba(255,255,255,0.14)');
    core.addColorStop(0.7, 'rgba(255,255,255,0)');
    ctx.fillStyle = core;
    ctx.fillRect(w * 0.37, 0, w * 0.26, h * 0.78);
    // Wave distortion along the column.
    ctx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 40; i++) {
      const y = rnd() * h;
      const a = 0.10 + rnd() * 0.4;
      ctx.strokeStyle = `rgba(0,0,0,${a})`;
      ctx.lineWidth = 1 + rnd() * 4;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= w; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.035 + i) * (2 + rnd() * 7));
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }, false);
}

function makeRainGlassTexture(gl) {
  return createCanvasTexture(gl, 1024, 1024, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const rnd = mulberry32(717);
    ctx.lineCap = 'round';
    // A few wide, soft runs of water first.
    for (let i = 0; i < 55; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const len = 60 + rnd() * 260;
      const grad = ctx.createLinearGradient(0, y - len, 0, y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.4, 'rgba(255,255,255,0.035)');
      grad.addColorStop(0.9, 'rgba(255,255,255,0.12)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 5 + rnd() * 13;
      ctx.beginPath();
      ctx.moveTo(x, y - len);
      ctx.bezierCurveTo(x + (rnd() - 0.5) * 14, y - len * 0.7, x + (rnd() - 0.5) * 8, y - len * 0.3, x, y);
      ctx.stroke();
    }
    // Sharper droplets and their trails.
    for (let i = 0; i < 230; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const len = 25 + rnd() * 210;
      const alpha = 0.10 + rnd() * 0.26;
      const grad = ctx.createLinearGradient(0, y - len, 0, y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.35, `rgba(255,255,255,${alpha * 0.4})`);
      grad.addColorStop(0.88, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.2 + rnd() * 3.4;
      ctx.beginPath();
      ctx.moveTo(x, y - len);
      ctx.quadraticCurveTo(x + (rnd() - 0.5) * 11, y - len * 0.48, x, y);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.85})`;
      ctx.beginPath();
      ctx.ellipse(x, y, 1.8 + rnd() * 3.4, 3.4 + rnd() * 6.2, 0, 0, TAU);
      ctx.fill();
    }
    for (let i = 0; i < 220; i++) {
      const x = rnd() * w, y = rnd() * h;
      const r = 2 + rnd() * 8;
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.22)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }
  }, true);
}

function makeDropTexture(gl) {
  return createCanvasTexture(gl, 128, 512, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, h * 0.15, 0, h);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.2, 'rgba(255,255,255,0.6)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.95)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(w / 2, h * 0.55, w * 0.12, h * 0.37, 0, 0, TAU);
    ctx.fill();
    ctx.filter = 'blur(3px)';
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.ellipse(w / 2, h * 0.42, w * 0.055, h * 0.22, 0, 0, TAU);
    ctx.fill();
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
  });
}

class DioramaRenderer {
  constructor(canvas, gl, atlas, ctx) {
    this.canvas = canvas;
    this.gl = gl;
    this.atlas = atlas;
    this.ctx = ctx;
    this.progs = {};
    this.textures = {};
    this.glows = new GlowDynamicBatch();
    this.streaks = new GlowDynamicBatch();
    this.particles = new GlowDynamicBatch();
    this.width = 1;
    this.height = 1;
    this.dpr = 1;
    const params = new URLSearchParams(location.search);
    this.qualityOverride = parseFloat(params.get('q')) || null;
    this.glassBoost = parseFloat(params.get('gb')) || 1;
    this._initPrograms();
    this._initStaticBuffers();
    this._initTextures();
    this._initRain();
    this._initFullscreen();
    this._initTargets();
    this._resize();
    const gl2 = this.gl;
    gl2.enable(gl2.DEPTH_TEST);
    gl2.depthFunc(gl2.LEQUAL);
    window.addEventListener('resize', () => this._resize());
  }

  _initPrograms() {
    const gl = this.gl;
    const P = this.progs;
    P.lit = createProgram(gl, SHADERS.litVS, SHADERS.litFS);
    P.outline = createProgram(gl, SHADERS.outlineVS, SHADERS.outlineFS);
    P.background = createProgram(gl, SHADERS.fullscreenVS, SHADERS.backgroundFS);
    P.textured = createProgram(gl, SHADERS.texturedVS, SHADERS.texturedFS);
    P.label = createProgram(gl, SHADERS.labelVS, SHADERS.labelFS);
    P.glass = createProgram(gl, SHADERS.glassVS, SHADERS.glassFS);
    P.transparent = createProgram(gl, SHADERS.transparentVS, SHADERS.transparentFS);
    P.puddle = createProgram(gl, SHADERS.puddleVS, SHADERS.puddleFS);
    P.glow = createProgram(gl, SHADERS.glowVS, SHADERS.glowFS);
    P.rain = createProgram(gl, SHADERS.rainVS, SHADERS.rainFS);
    P.splash = createProgram(gl, SHADERS.splashVS, SHADERS.splashFS);
    P.bright = createProgram(gl, SHADERS.fullscreenVS, SHADERS.brightFS);
    P.blur = createProgram(gl, SHADERS.fullscreenVS, SHADERS.blurFS);
    P.composite = createProgram(gl, SHADERS.fullscreenVS, SHADERS.compositeFS);
    this._initFinalQuad();
  }

  _initFinalQuad() {
    const gl = this.gl;
    this.fsVao = gl.createVertexArray();
    gl.bindVertexArray(this.fsVao);
    const b = createBuffer(gl, gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]));
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
  }

  _initFullscreen() { /* alias kept for clarity */ }

  _initStaticBuffers() {
    const gl = this.gl;
    const ctx = this.ctx;
    this.lit = makeLitBatch(gl, ctx.lit.build());
    this.labels = makeIndexedBatch(gl, LABEL_LAYOUT, ctx.labels.build());
    this.decals = makeIndexedBatch(gl, LABEL_LAYOUT, ctx.decals.build());
    this.signLabels = makeIndexedBatch(gl, LABEL_LAYOUT, ctx.signLabels.build());
    this.glassFixed = makeIndexedBatch(gl, [
      { loc: 0, key: 'position', size: 3 },
      { loc: 1, key: 'uv', size: 2 },
      { loc: 2, key: 'normal', size: 3 },
    ], ctx.glassFixed.build());
    this.transparent = makeIndexedBatch(gl, TRANSPARENT_LAYOUT, ctx.transparent.build());
    this.puddles = makeIndexedBatch(gl, [
      { loc: 0, key: 'position', size: 3 },
    ], ctx.puddles.build());
    this.ground = [];
    for (const layer of ctx.groundLayers) {
      const batch = makeIndexedBatch(gl, [
        { loc: 0, key: 'position', size: 3 },
        { loc: 1, key: 'uv', size: 2 },
      ], layer.builder.build());
      if (batch) this.ground.push({ batch, textureKey: layer.texture, tint: layer.tint || [1, 1, 1] });
    }
    // Dynamic glass doors.
    this.doors = [];
    if (ctx.doors) {
      for (const door of ctx.doors) {
        const frames = makeLitBatch(gl, door.frame.build());
        const glass = makeIndexedBatch(gl, [
          { loc: 0, key: 'position', size: 3 },
          { loc: 1, key: 'uv', size: 2 },
          { loc: 2, key: 'normal', size: 3 },
        ], door.glass.build());
        this.doors.push({ frames, glass, closedX: door.closedX, openX: door.openX, z: door.z });
      }
    }
    this.doorOpen = 0;
  }

  _initTextures() {
    const gl = this.gl;
    const T = this.textures;
    T.glow = makeGlowTexture(gl);
    T.streak = makeStreakTexture(gl);
    T.rainGlass = makeRainGlassTexture(gl);
    T.drop = makeDropTexture(gl);
    const asphalt = makeAsphaltCanvas(1024);
    const paver = makePaverCanvas(1024);
    const interior = makeInteriorFloorCanvas(1024);
    const upload = (canvas, repeat = true) => {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
      return tex;
    };
    T.asphalt = upload(asphalt, true);
    T.paver = upload(paver, true);
    T.interiorFloor = upload(interior, true);
  }

  _initRain() {
    const gl = this.gl;
    const rain = this.ctx.rain;
    const corner = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
    this.rain = rain;
    if (rain && rain.count) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const cb = createBuffer(gl, gl.ARRAY_BUFFER, corner);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const sb = createBuffer(gl, gl.ARRAY_BUFFER, rain.seeds);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(1, 1);
      const shb = createBuffer(gl, gl.ARRAY_BUFFER, rain.shapes);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(2, 1);
      gl.bindVertexArray(null);
      this.rainVao = vao;
    }
    const splash = this.ctx.splash;
    this.splash = splash;
    if (splash && splash.count) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      createBuffer(gl, gl.ARRAY_BUFFER, corner);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const sb = createBuffer(gl, gl.ARRAY_BUFFER, splash.seeds);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(1, 1);
      const pb = createBuffer(gl, gl.ARRAY_BUFFER, splash.params);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(2, 1);
      gl.bindVertexArray(null);
      this.splashVao = vao;
    }
    this.rainCorners = corner;
    this.dynamicGlowVao = gl.createVertexArray();
    gl.bindVertexArray(this.dynamicGlowVao);
    this.dynamicGlowBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynamicGlowBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, 9 * 6 * 600, gl.DYNAMIC_DRAW);
    const stride = 9 * 4;
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 3, gl.FLOAT, false, stride, 20);
    gl.enableVertexAttribArray(3);
    gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, 32);
    gl.bindVertexArray(null);
  }

  _createColorTarget(useFloat, w, h) {
    const gl = this.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, useFloat ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, useFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }

  _makeTarget(w, h, useFloat, withDepth) {
    const gl = this.gl;
    const tex = this._createColorTarget(useFloat, w, h);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    let depth = null;
    if (withDepth) {
      depth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
    }
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) {
      gl.deleteFramebuffer(fbo);
      gl.deleteTexture(tex);
      return null;
    }
    return { fbo, tex, depth, w, h };
  }

  _initTargets() {
    const gl = this.gl;
    const floatExt = gl.getExtension('EXT_color_buffer_float');
    this.useFloat = !!floatExt;
    let scene = this._makeTarget(this.width, this.height, this.useFloat, true);
    if (!scene) {
      this.useFloat = false;
      scene = this._makeTarget(this.width, this.height, false, true);
    }
    this.sceneTarget = scene;
    const bw = Math.max(2, Math.floor(this.width / 2));
    const bh = Math.max(2, Math.floor(this.height / 2));
    this.bloomA = this._makeTarget(bw, bh, this.useFloat, false);
    this.bloomB = this._makeTarget(bw, bh, this.useFloat, false);
    if (!this.bloomA) {
      this.bloomA = this._makeTarget(bw, bh, false, false);
      this.bloomB = this._makeTarget(bw, bh, false, false);
    }
  }

  _resize() {
    const gl = this.gl;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let cssW = Math.max(1, window.innerWidth);
    let cssH = Math.max(1, window.innerHeight);
    let scale = this.qualityOverride || Math.min(1.35, Math.max(1.0, dpr * 1.28));
    let w = Math.round(cssW * scale);
    let h = Math.round(cssH * scale);
    const maxPixels = 4.4e6;
    if (w * h > maxPixels) {
      const f = Math.sqrt(maxPixels / (w * h));
      w = Math.max(1, Math.round(w * f));
      h = Math.max(1, Math.round(h * f));
    }
    if (w > 3000) { const f = 3000 / w; w = 3000; h = Math.round(h * f); }
    if (this.width === w && this.height === h && this.sceneTarget) return;
    this.width = w;
    this.height = h;
    this.dpr = dpr;
    this.canvas.width = w;
    this.canvas.height = h;
    // Rebuild targets when the CSS size changes.
    if (this.sceneTarget) {
      gl.deleteFramebuffer(this.sceneTarget.fbo);
      gl.deleteTexture(this.sceneTarget.tex);
      if (this.sceneTarget.depth) gl.deleteRenderbuffer(this.sceneTarget.depth);
      for (const t of [this.bloomA, this.bloomB]) {
        if (t) { gl.deleteFramebuffer(t.fbo); gl.deleteTexture(t.tex); }
      }
    }
    const float = this.useFloat;
    this.sceneTarget = this._makeTarget(w, h, float, true) || this._makeTarget(w, h, false, true);
    const bw = Math.max(2, Math.floor(w / 2));
    const bh = Math.max(2, Math.floor(h / 2));
    this.bloomA = this._makeTarget(bw, bh, this.useFloat, false) || this._makeTarget(bw, bh, false, false);
    this.bloomB = this._makeTarget(bw, bh, this.useFloat, false) || this._makeTarget(bw, bh, false, false);
  }

  _bindSceneTarget() {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.sceneTarget.fbo);
    gl.viewport(0, 0, this.width, this.height);
    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  }

  _drawBackground(time, camera) {
    const gl = this.gl;
    const p = this.progs.background;
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    p.use();
    gl.uniform1f(p.u('uTime'), time);
    gl.uniform2f(p.u('uResolution'), this.width, this.height);
    gl.bindVertexArray(this.fsVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);
  }

  _setCommonLightUniforms(prog, camera) {
    const gl = this.gl;
    const ctx = this.ctx;
    gl.uniform3f(prog.u('uCamPos'), camera.eye[0], camera.eye[1], camera.eye[2]);
    gl.uniform3f(prog.u('uMoonDir'), -0.52, 0.72, 0.46);
    gl.uniform3f(prog.u('uMoonColor'), 0.40, 0.55, 0.74);
    gl.uniform3f(prog.u('uSkyAmbient'), 0.105, 0.155, 0.235);
    gl.uniform3f(prog.u('uGroundAmbient'), 0.032, 0.050, 0.074);
    gl.uniform3f(prog.u('uInteriorAmbient'), 0.28, 0.175, 0.075);
    gl.uniform3f(prog.u('uRimColor'), 0.46, 0.70, 0.86);
    gl.uniform3f(prog.u('uFogColor'), 0.025, 0.043, 0.058);
    // Store lights (must be mirrored by the actual emissive fixtures).
    const storeLights = ctx.storeLights;
    const sl = new Float32Array(20);
    const sc = new Float32Array(20);
    for (let i = 0; i < 5; i++) {
      const L = storeLights[i] || { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 };
      sl[i * 4] = L.pos[0]; sl[i * 4 + 1] = L.pos[1]; sl[i * 4 + 2] = L.pos[2]; sl[i * 4 + 3] = L.range;
      sc[i * 4] = L.color[0]; sc[i * 4 + 1] = L.color[1]; sc[i * 4 + 2] = L.color[2]; sc[i * 4 + 3] = L.intensity;
    }
    gl.uniform4fv(prog.u('uStoreLights'), sl);
    gl.uniform4fv(prog.u('uStoreLightColors'), sc);
    const streetLights = ctx.streetLights;
    const el = new Float32Array(24);
    const ec = new Float32Array(24);
    for (let i = 0; i < 6; i++) {
      const L = streetLights[i] || { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 };
      el[i * 4] = L.pos[0]; el[i * 4 + 1] = L.pos[1]; el[i * 4 + 2] = L.pos[2]; el[i * 4 + 3] = L.range;
      ec[i * 4] = L.color[0]; ec[i * 4 + 1] = L.color[1]; ec[i * 4 + 2] = L.color[2]; ec[i * 4 + 3] = L.intensity;
    }
    gl.uniform4fv(prog.u('uStreetLights'), el);
    gl.uniform4fv(prog.u('uStreetLightColors'), ec);
    gl.uniform1f(prog.u('uTime'), performance.now() * 0.001);
  }

  _drawLitStatic(camera) {
    const gl = this.gl;
    if (!this.lit) return;
    const vp = camera.vp;
    if (this.lit.outline) {
      const o = this.progs.outline;
      o.use();
      gl.uniformMatrix4fv(o.u('uVP'), false, vp);
      gl.uniformMatrix4fv(o.u('uModel'), false, m4.identity(_identityMatrix));
      gl.uniform3f(o.u('uOutlineColor'), 0.025, 0.043, 0.055);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.FRONT);
      gl.bindVertexArray(this.lit.outline.vao);
      gl.drawElements(gl.TRIANGLES, this.lit.outline.count, gl.UNSIGNED_INT, 0);
      gl.disable(gl.CULL_FACE);
    }
    const p = this.progs.lit;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, vp);
    gl.uniformMatrix4fv(p.u('uModel'), false, m4.identity(_identityMatrix));
    this._setCommonLightUniforms(p, camera);
    gl.bindVertexArray(this.lit.vao);
    gl.drawElements(gl.TRIANGLES, this.lit.count, gl.UNSIGNED_INT, 0);
  }

  _drawGround(camera) {
    const gl = this.gl;
    if (!this.ground.length) return;
    const p = this.progs.textured;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniformMatrix4fv(p.u('uModel'), false, m4.identity(_identityMatrix));
    gl.uniform3f(p.u('uCamPos'), camera.eye[0], camera.eye[1], camera.eye[2]);
    gl.uniform3f(p.u('uFogColor'), 0.020, 0.036, 0.050);
    for (const g of this.ground) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.textures[g.textureKey]);
      gl.uniform1i(p.u('uTexture'), 0);
      gl.uniform3fv(p.u('uTint'), new Float32Array(g.tint));
      gl.bindVertexArray(g.batch.vao);
      gl.drawElements(gl.TRIANGLES, g.batch.count, gl.UNSIGNED_INT, 0);
    }
  }

  _drawOpaqueLabels(camera, time) {
    const gl = this.gl;
    const p = this.progs.label;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniformMatrix4fv(p.u('uModel'), false, m4.identity(_identityMatrix));
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.atlas.texture);
    gl.uniform1i(p.u('uTexture'), 0);
    gl.uniform1f(p.u('uAlphaTest'), 0.18);
    gl.uniform1f(p.u('uGlobalAlpha'), 1.0);
    if (this.labels) {
      gl.uniform1f(p.u('uBrightness'), 0.88);
      gl.bindVertexArray(this.labels.vao);
      gl.drawElements(gl.TRIANGLES, this.labels.count, gl.UNSIGNED_INT, 0);
    }
    if (this.signLabels) {
      const fl = this.ctx.signFlicker ? this.ctx.signFlicker(time) : 1;
      gl.uniform1f(p.u('uBrightness'), 0.92 * fl);
      gl.bindVertexArray(this.signLabels.vao);
      gl.drawElements(gl.TRIANGLES, this.signLabels.count, gl.UNSIGNED_INT, 0);
    }
  }

  _drawPuddles(camera, time) {
    const gl = this.gl;
    if (!this.puddles) return;
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    const p = this.progs.puddle;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniform3f(p.u('uCamPos'), camera.eye[0], camera.eye[1], camera.eye[2]);
    gl.uniform1f(p.u('uTime'), time);
    gl.uniform3f(p.u('uFogColor'), 0.020, 0.036, 0.050);
    gl.bindVertexArray(this.puddles.vao);
    gl.drawElements(gl.TRIANGLES, this.puddles.count, gl.UNSIGNED_INT, 0);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawGlass(camera, time) {
    const gl = this.gl;
    const p = this.progs.glass;
    p.use();
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniform3f(p.u('uCamPos'), camera.eye[0], camera.eye[1], camera.eye[2]);
    gl.uniform1f(p.u('uTime'), time);
    gl.uniform1f(p.u('uOpacity'), 0.125 * this.glassBoost);
    gl.uniform1f(p.u('uRain'), 1.8 * Math.min(2.1, this.glassBoost));
    gl.uniform3f(p.u('uTint'), 0.48, 0.43, 0.33);
    gl.uniform1f(p.u('uVendingGlow'), 0.0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.textures.rainGlass);
    gl.uniform1i(p.u('uRainTexture'), 0);
    const identity = m4.identity(_identityMatrix);
    if (this.glassFixed) {
      gl.uniformMatrix4fv(p.u('uModel'), false, identity);
      gl.bindVertexArray(this.glassFixed.vao);
      gl.drawElements(gl.TRIANGLES, this.glassFixed.count, gl.UNSIGNED_INT, 0);
    }
    if (this.doors) {
      const open = this.doorOpen;
      for (let i = 0; i < this.doors.length; i++) {
        const door = this.doors[i];
        if (!door.glass) continue;
        const x = lerp(door.closedX, door.openX, open);
        const m = m4.translation(_doorMatrix, x, 0, 0);
        gl.uniformMatrix4fv(p.u('uModel'), false, m);
        gl.bindVertexArray(door.glass.vao);
        gl.drawElements(gl.TRIANGLES, door.glass.count, gl.UNSIGNED_INT, 0);
      }
    }
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawDoors(camera, time) {
    const gl = this.gl;
    if (!this.doors) return;
    const open = this.doorOpen;
    for (let i = 0; i < this.doors.length; i++) {
      const door = this.doors[i];
      if (!door.frames) continue;
      const x = lerp(door.closedX, door.openX, open);
      const m = m4.translation(_doorMatrix, x, 0, 0);
      if (door.frames.outline) {
        const o = this.progs.outline;
        o.use();
        gl.uniformMatrix4fv(o.u('uVP'), false, camera.vp);
        gl.uniformMatrix4fv(o.u('uModel'), false, m);
        gl.uniform3f(o.u('uOutlineColor'), 0.025, 0.043, 0.055);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.bindVertexArray(door.frames.outline.vao);
        gl.drawElements(gl.TRIANGLES, door.frames.outline.count, gl.UNSIGNED_INT, 0);
        gl.disable(gl.CULL_FACE);
      }
      const p = this.progs.lit;
      p.use();
      gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
      gl.uniformMatrix4fv(p.u('uModel'), false, m);
      this._setCommonLightUniforms(p, camera);
      gl.bindVertexArray(door.frames.vao);
      gl.drawElements(gl.TRIANGLES, door.frames.count, gl.UNSIGNED_INT, 0);
    }
  }

  _drawTransparent(camera) {
    const gl = this.gl;
    if (!this.transparent) return;
    const p = this.progs.transparent;
    p.use();
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniformMatrix4fv(p.u('uModel'), false, m4.identity(_identityMatrix));
    gl.uniform3f(p.u('uCamPos'), camera.eye[0], camera.eye[1], camera.eye[2]);
    gl.bindVertexArray(this.transparent.vao);
    gl.drawElements(gl.TRIANGLES, this.transparent.count, gl.UNSIGNED_INT, 0);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawDecals(camera, time) {
    const gl = this.gl;
    if (!this.decals) return;
    const p = this.progs.label;
    p.use();
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniformMatrix4fv(p.u('uModel'), false, m4.identity(_identityMatrix));
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.atlas.texture);
    gl.uniform1i(p.u('uTexture'), 0);
    gl.uniform1f(p.u('uAlphaTest'), 0.015);
    gl.uniform1f(p.u('uBrightness'), 0.82);
    gl.uniform1f(p.u('uGlobalAlpha'), 1.0);
    gl.bindVertexArray(this.decals.vao);
    gl.drawElements(gl.TRIANGLES, this.decals.count, gl.UNSIGNED_INT, 0);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _quadBillboard(batch, pos, w, h, color, alpha, right, up, uv0 = [0, 0], uv1 = [1, 1]) {
    const hx = w / 2, hy = h / 2;
    const p0 = [pos[0] - right[0] * hx - up[0] * hy, pos[1] - right[1] * hx - up[1] * hy, pos[2] - right[2] * hx - up[2] * hy, uv0[0], uv0[1]];
    const p1 = [pos[0] + right[0] * hx - up[0] * hy, pos[1] + right[1] * hx - up[1] * hy, pos[2] + right[2] * hx - up[2] * hy, uv1[0], uv0[1]];
    const p2 = [pos[0] + right[0] * hx + up[0] * hy, pos[1] + right[1] * hx + up[1] * hy, pos[2] + right[2] * hx + up[2] * hy, uv1[0], uv1[1]];
    const p3 = [pos[0] - right[0] * hx + up[0] * hy, pos[1] - right[1] * hx + up[1] * hy, pos[2] - right[2] * hx + up[2] * hy, uv0[0], uv1[1]];
    batch.addRect([p0, p1, p2, p3], color, alpha);
  }

  _groundQuadY(batch, x, z, w, d, y, rot, color, alpha, uv0 = [0, 0], uv1 = [1, 1]) {
    const c = Math.cos(rot), s = Math.sin(rot);
    const hw = w / 2, hd = d / 2;
    const loc = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]];
    const pts = loc.map(([lx, lz], i) => {
      const wx = x + lx * c - lz * s;
      const wz = z + lx * s + lz * c;
      const u = i === 1 || i === 2 ? uv1[0] : uv0[0];
      const v = i >= 2 ? uv1[1] : uv0[1];
      return [wx, y, wz, u, v];
    });
    batch.addRect(pts, color, alpha);
  }

  _drawGroundLights(camera, time) {
    const gl = this.gl;
    const ctx = this.ctx;
    this.glows.reset();
    this.streaks.reset();
    const right = camera.right;
    const up = camera.up;

    // Soft pools of store light, sodium light and vending-machine light on the
    // wet paving. These are intentionally broad and very low contrast.
    const pools = ctx.lightPools || [];
    for (const L of pools) {
      let a = L.alpha * 1.5;
      if (L.pulse) a *= L.pulse(time);
      this._groundQuadY(this.glows, L.x, L.z, L.w, L.d, L.y, L.rot || 0, L.color, a);
    }
    const tphase = ctx.traffic && ctx.trafficPhase ? ctx.trafficPhase(time) : null;
    if (ctx.traffic && tphase) {
      const tp = ctx.traffic;
      const activeColor = tphase.carColor;
      this._groundQuadY(this.glows, tp.poolPos[0], tp.poolPos[1] + 0.3, 2.6, 2.2, 0.04, 0, activeColor, 0.045);
      this._groundQuadY(this.glows, tp.poolPos[0], tp.poolPos[1] + 0.6, 3.4, 1.2, 0.041, 0, activeColor, 0.025);
      // Pedestrian signal wash.
      const pcol = tphase.pedOn ? '#69e3b0' : '#e16255';
      this._groundQuadY(this.glows, 4.5, 5.15, 1.5, 1.0, 0.04, 0, pcol, 0.026);
    }
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);
    gl.depthMask(false);
    const p = this.progs.glow;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.textures.glow);
    gl.uniform1i(p.u('uTexture'), 0);
    gl.uniform1f(p.u('uScreenAlpha'), 1.0);
    this._uploadAndDrawDynamic(this.glows, gl.TRIANGLES);

    // Light reflected down the wet street toward the viewer. Rebuilt every
    // frame so it follows the camera, like a real puddle reflection.
    const camGroundX = camera.eye[0];
    const camGroundZ = camera.eye[2];
    const sources = ctx.reflections || [];
    for (const R of sources) {
      let dx = camGroundX - R.x;
      let dz = camGroundZ - R.z;
      const dl = Math.hypot(dx, dz);
      if (dl < 0.25) continue;
      dx /= dl; dz /= dl;
      const px = -dz, pz = dx;
      const len = Math.min(R.length, Math.max(1.5, dl * 0.82));
      const w = R.width * (0.72 + Math.min(1.15, len / (R.length || 1)) * 0.28);
      const start = 0.08;
      const sway = Math.sin(time * 0.55 + (R.phase || 0)) * w * 0.06;
      const x0 = R.x + dx * start - px * w * 0.5 + px * sway;
      const z0 = R.z + dz * start - pz * w * 0.5 + pz * sway;
      const x1 = R.x + dx * start + px * w * 0.5 + px * sway;
      const z1 = R.z + dz * start + pz * w * 0.5 + pz * sway;
      const x2 = R.x + dx * (start + len) + px * w * 0.86;
      const z2 = R.z + dz * (start + len) + pz * w * 0.86;
      const x3 = R.x + dx * (start + len) - px * w * 0.86;
      const z3 = R.z + dz * (start + len) - pz * w * 0.86;
      const alpha = R.alpha * 2.35 * (0.82 + Math.sin(time * 0.9 + (R.phase || 0)) * 0.12);
      // v=0 at the light source, v=1 stretched toward the viewer.
      const pts = [
        [x0, R.y, z0, 0, 0], [x1, R.y, z1, 1, 0],
        [x2, R.y, z2, 1, 1], [x3, R.y, z3, 0, 1],
      ];
      this.streaks.addRect(pts, R.color, alpha);
    }
    if (ctx.traffic && tphase) {
      const color = tphase.carColor;
      const sx = ctx.traffic.poolPos[0];
      const sz = ctx.traffic.poolPos[1] + 0.25;
      let dx = camGroundX - sx;
      let dz = camGroundZ - sz;
      const dl = Math.hypot(dx, dz) || 1;
      dx /= dl; dz /= dl;
      const px = -dz, pz = dx;
      const len = Math.min(4.0, dl * 0.72);
      const w = 0.42;
      const x0 = sx - px * w * 0.2, z0 = sz - pz * w * 0.2;
      const x1 = sx + px * w * 0.2, z1 = sz + pz * w * 0.2;
      const x2 = sx + dx * len + px * w * 0.8, z2 = sz + dz * len + pz * w * 0.8;
      const x3 = sx + dx * len - px * w * 0.8, z3 = sz + dz * len - pz * w * 0.8;
      this.streaks.addRect([[x0, 0.043, z0, 0, 0], [x1, 0.043, z1, 1, 0], [x2, 0.043, z2, 1, 1], [x3, 0.043, z3, 0, 1]], color, 0.08);
    }
    gl.bindTexture(gl.TEXTURE_2D, this.textures.streak);
    gl.uniform1i(p.u('uTexture'), 0);
    this._uploadAndDrawDynamic(this.streaks, gl.TRIANGLES);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _uploadAndDrawDynamic(batch, mode) {
    const gl = this.gl;
    if (batch.verts.length === 0) return;
    gl.bindVertexArray(this.dynamicGlowVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynamicGlowBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(batch.verts), gl.DYNAMIC_DRAW);
    gl.drawArrays(mode, 0, batch.verts.length / 9);
  }

  _drawSprites(camera, time) {
    const gl = this.gl;
    const ctx = this.ctx;
    this.glows.reset();
    const right = camera.right;
    const up = camera.up;
    for (const G of ctx.glows) {
      let alpha = G.alpha;
      if (G.pulse) alpha *= G.pulse(time);
      if (G.visible && !G.visible(time)) continue;
      this._quadBillboard(this.glows, G.pos, G.size, G.size * (G.aspect || 1), G.color, alpha, right, up);
      if (G.core) {
        this._quadBillboard(this.glows, G.pos, G.size * 0.38, G.size * 0.38 * (G.aspect || 1), '#ffffff', alpha * 0.75, right, up);
      }
    }
    // Auto-door threshold warmth, strongest when the door is open.
    const doorGlow = ctx.doorGlow;
    if (doorGlow) {
      const a = doorGlow.alpha * (0.45 + this.doorOpen * 0.55);
      this._quadBillboard(this.glows, doorGlow.pos, doorGlow.size, doorGlow.size, doorGlow.color, a, right, up);
    }
    // Traffic light state. Small, camera-facing discs sit in the dark lenses
    // and only one at a time is lit, with the walking signal answering it.
    if (ctx.traffic && ctx.trafficPhase) {
      const tp = ctx.trafficPhase(time);
      for (let i = 0; i < ctx.traffic.carLights.length; i++) {
        if (i !== tp.car) continue;
        const lamp = ctx.traffic.carLights[i];
        this._quadBillboard(this.glows, lamp.pos, 0.39, 0.39, tp.carColor, 0.48, right, up);
        this._quadBillboard(this.glows, lamp.pos, 0.20, 0.20, '#fff9de', 0.32, right, up);
      }
      const activePed = tp.pedOn ? ctx.traffic.pedLowPos : ctx.traffic.pedPos;
      const pcol = tp.pedOn ? '#6ee7b4' : '#ec6358';
      this._quadBillboard(this.glows, activePed, 0.28, 0.28, pcol, tp.pedOn && tp.flash ? 0.12 : 0.3, right, up);
      if (tp.pedOn && tp.flash) {
        this._quadBillboard(this.glows, activePed, 0.15, 0.15, '#f2fff4', 0.15, right, up);
      }
    }
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);
    gl.depthMask(false);
    const p = this.progs.glow;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.textures.glow);
    gl.uniform1i(p.u('uTexture'), 0);
    gl.uniform1f(p.u('uScreenAlpha'), 1.0);
    this._uploadAndDrawDynamic(this.glows, gl.TRIANGLES);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawRain(camera, time) {
    const gl = this.gl;
    if (!this.rainVao) return;
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);
    gl.depthMask(false);
    const p = this.progs.rain;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniform3f(p.u('uCamPos'), camera.eye[0], camera.eye[1], camera.eye[2]);
    gl.uniform3f(p.u('uCamRight'), camera.right[0], camera.right[1], camera.right[2]);
    gl.uniform1f(p.u('uTime'), time);
    gl.uniform3f(p.u('uColor'), 0.62, 0.78, 0.92);
    gl.uniform1f(p.u('uOpacity'), 0.19);
    gl.bindVertexArray(this.rainVao);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.rain.count);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawSplashes(camera, time) {
    const gl = this.gl;
    if (!this.splashVao) return;
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);
    gl.depthMask(false);
    const p = this.progs.splash;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.uniform1f(p.u('uTime'), time);
    gl.uniform1f(p.u('uOpacity'), 0.20);
    gl.bindVertexArray(this.splashVao);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.splash.count);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawParticles(camera, time) {
    const gl = this.gl;
    const ctx = this.ctx;
    if ((!ctx.steamEmitters || !ctx.steamEmitters.length) && (!ctx.drips || !ctx.drips.length)) return;
    this.particles.reset();
    const right = camera.right;
    const up = camera.up;
    // Interior steam: slow, warm, almost invisible through the glass.
    for (const em of ctx.steamEmitters || []) {
      for (let i = 0; i < em.count; i++) {
        const seed = (i * 0.61803398875 + em.phase) % 1;
        const life = ((time * em.speed + seed) % 1);
        const x = em.pos[0] + Math.sin((seed * 31.7 + time * 0.42) * 2.1) * em.spread * life;
        const z = em.pos[2] + Math.cos((seed * 17.3 + time * 0.31) * 2.4) * em.spread * life * 0.7;
        const y = em.pos[1] + life * em.rise;
        const size = em.size * (0.5 + life * 1.8);
        const alpha = em.alpha * Math.sin(life * PI) * (1.0 - life * 0.5);
        this._quadBillboard(this.particles, [x, y, z], size, size, em.color, alpha, right, up);
      }
    }
    // Rainwater dripping from the canopy edge.
    for (const drip of ctx.drips || []) {
      const cycle = (time * drip.speed + drip.phase) % 1;
      const fall = smoothstep(0.05, 0.98, cycle);
      const y = drip.y - fall * drip.drop;
      const sway = Math.sin(time * 2.0 + drip.phase * 11) * 0.012;
      const alpha = Math.sin(cycle * PI) * 0.45;
      this._quadBillboard(this.particles, [drip.x + sway, y, drip.z], 0.028, 0.22, '#a7c7df', alpha, right, up, [0, 0], [1, 1]);
    }
    if (this.particles.verts.length === 0) return;
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);
    gl.depthMask(false);
    const p = this.progs.glow;
    p.use();
    gl.uniformMatrix4fv(p.u('uVP'), false, camera.vp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.textures.drop);
    gl.uniform1i(p.u('uTexture'), 0);
    gl.uniform1f(p.u('uScreenAlpha'), 1.0);
    this._uploadAndDrawDynamic(this.particles, gl.TRIANGLES);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  _drawPost() {
    const gl = this.gl;
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomA.fbo);
    gl.viewport(0, 0, this.bloomA.w, this.bloomA.h);
    const bright = this.progs.bright;
    bright.use();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.sceneTarget.tex);
    gl.uniform1i(bright.u('uScene'), 0);
    gl.uniform2f(bright.u('uTexel'), 1 / this.width, 1 / this.height);
    gl.uniform1f(bright.u('uThreshold'), 0.56);
    gl.uniform1f(bright.u('uKnee'), 0.22);
    gl.bindVertexArray(this.fsVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    const blur = this.progs.blur;
    blur.use();
    gl.uniform1i(blur.u('uTexture'), 0);
    // Four widening ping-pong passes create both a tight neon core and a wide
    // soft halation around the shop lights.
    const radii = [1.3, 3.2, 6.4, 10.5];
    for (let pass = 0; pass < radii.length; pass++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomB.fbo);
      gl.viewport(0, 0, this.bloomB.w, this.bloomB.h);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.bloomA.tex);
      gl.uniform2f(blur.u('uDirection'), radii[pass] / this.bloomA.w, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomA.fbo);
      gl.viewport(0, 0, this.bloomA.w, this.bloomA.h);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.bloomB.tex);
      gl.uniform2f(blur.u('uDirection'), 0, radii[pass] / this.bloomA.h);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.width, this.height);
    const cp = this.progs.composite;
    cp.use();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.sceneTarget.tex);
    gl.uniform1i(cp.u('uScene'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.bloomA.tex);
    gl.uniform1i(cp.u('uBloom'), 1);
    gl.uniform2f(cp.u('uResolution'), this.width, this.height);
    gl.uniform1f(cp.u('uTime'), this.time || 0);
    gl.uniform1f(cp.u('uBloomStrength'), 0.98);
    gl.bindVertexArray(this.fsVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.activeTexture(gl.TEXTURE0);
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);
  }

  render(time, camera, doorOpen) {
    const gl = this.gl;
    this.time = time;
    this.doorOpen = doorOpen;
    this._resize();
    this._bindSceneTarget();
    this._drawBackground(time, camera);
    this._drawGround(camera);
    this._drawLitStatic(camera);
    this._drawDoors(camera, time);
    this._drawOpaqueLabels(camera, time);
    this._drawPuddles(camera, time);
    this._drawGroundLights(camera, time);
    this._drawGlass(camera, time);
    this._drawTransparent(camera);
    this._drawDecals(camera, time);
    this._drawSprites(camera, time);
    this._drawRain(camera, time);
    this._drawSplashes(camera, time);
    this._drawParticles(camera, time);
    this._drawPost();
  }
}

const _identityMatrix = m4.identity(new Float32Array(16));
const _doorMatrix = new Float32Array(16);


// ===== scene-base.js =====
'use strict';

/* ---------------------------------------------------------------------------
   World constants and the square collectible base / street surface.
--------------------------------------------------------------------------- */

const WORLD = {
  half: 7.0,
  baseHalf: 7.28,
  sidewalkY: 0.16,
  roadY: 0.005,
  sidewalkFrontZ: 2.75,
  sidewalkRightX: 4.45,
  farSidewalkZ: 5.25,
  farRightX: 6.55,
};

const STORE = {
  x0: -4.0,
  x1: 2.0,
  z0: -5.0,
  z1: 0.55,
  floor: 0.225,
  ceiling: 2.78,
  roof: 3.5,
  glassBottom: 0.63,
  glassTop: 2.58,
};

function addGlow(ctx, def) {
  ctx.glows.push({
    pos: def.pos,
    size: def.size ?? 1,
    aspect: def.aspect ?? 1,
    color: def.color || '#ffffff',
    alpha: def.alpha ?? 0.5,
    pulse: def.pulse || null,
    core: def.core ?? false,
    visible: def.visible || null,
  });
}

function addLightPool(ctx, def) {
  ctx.lightPools.push({
    x: def.x, z: def.z, w: def.w, d: def.d, y: def.y ?? 0.18,
    rot: def.rot || 0, color: def.color || '#ffffff', alpha: def.alpha ?? 0.2,
    pulse: def.pulse || null,
  });
}

function addReflection(ctx, def) {
  ctx.reflections.push({
    x: def.x, z: def.z, y: def.y ?? 0.185, color: def.color || '#ffffff',
    width: def.width || 1.0, length: def.length || 5.0, alpha: def.alpha ?? 0.3,
    phase: def.phase ?? 0,
  });
}

function createSceneContext(atlas) {
  const ctx = {
    atlas,
    lit: new MeshBuilder(),
    labels: new LabelBuilder(atlas),
    decals: new LabelBuilder(atlas),
    signLabels: new LabelBuilder(atlas),
    glassFixed: new GlassBuilder(),
    transparent: new TransparentBuilder(),
    puddles: new PuddleBuilder(),
    groundLayers: [],
    doors: [],
    glows: [],
    lightPools: [],
    reflections: [],
    storeLights: [
      { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 },
      { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 },
      { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 },
      { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 },
      { pos: [0, -10, 0], color: [0, 0, 0], intensity: 0, range: 1 },
    ],
    streetLights: [
      { pos: [4.1, 4.7, 2.4], color: [1.0, 0.64, 0.32], intensity: 2.15, range: 8.4 },
      { pos: [-5.0, 1.4, 1.7], color: [0.48, 0.82, 1.0], intensity: 1.05, range: 4.0 },
      { pos: [0.1, 1.6, 1.4], color: [1.0, 0.63, 0.28], intensity: 1.15, range: 7.2 },
      { pos: [5.5, 3.0, 5.5], color: [0.95, 0.22, 0.16], intensity: 0.22, range: 4.4 },
      { pos: [-1.7, 1.85, 1.05], color: [1.0, 0.58, 0.22], intensity: 0.58, range: 4.6 },
      { pos: [1.15, 1.7, 1.2], color: [1.0, 0.66, 0.30], intensity: 0.52, range: 4.2 },
    ],
    steamEmitters: [],
    drips: [],
    dynamic: {},
    signFlicker: (t) => 1.0,
    doorGlow: null,
    doorOpen: (t) => 0,
  };
  return ctx;
}

/* ---------------------------------------------------------------------------
   The square plinth. A dark, lacquered collectible base with a slim brass
   inlay, restrained bevels and a small museum-style identity plaque.
--------------------------------------------------------------------------- */
function buildBase(ctx) {
  const B = ctx.lit;
  const H = WORLD.baseHalf;

function buildScene(atlas) {
  const ctx = createSceneContext(atlas);
  buildBase(ctx);
  buildStore(ctx);
  buildStreet(ctx);
  buildEffects(ctx);
  return ctx;
}

'use strict';

/* ---------------------------------------------------------------------------
   The street corner around Tsukimi Mart: vending machines, bicycles, utility
   poles and sagging wires, a warm street lamp, guardrails, the neighbour's
   old shuttered shop and a traffic signal that keeps its slow night rhythm.
--------------------------------------------------------------------------- */

function appendPlaced(ctx, local, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = m4.identity(new Float32Array(16));
  m4.compose(m, x, y, z, rx, ry, rz, 1, 1, 1);
  ctx.lit.append(local, m);
}

function addContactShadow(ctx, x, z, rx, rz, y = 0.171, seed = 1, color = '#252f31') {
  ctx.lit.puddle(x, z, rx, rz, color, { y, seed, segments: 14, emit: 0.0, group: 0 });
}

/* A tiny calico waiting out the rain under the side canopy. She is the only
   living thing in the scene, and she knows exactly where the warm glass is. */
function addStoreCat(ctx, x, y, z, yaw) {
  const local = new MeshBuilder();
  const cream = '#ead7b8';
  const ginger = '#c88451';
  const dark = '#534237';
  const pink = '#c98d83';
  // cushion
  local.cylinder(0, 0.022, 0, 0.22, 0.24, 0.045, 14, '#5c6e5a', { outline: 0.004 });
  local.cylinder(0, 0.05, 0, 0.17, 0.20, 0.025, 14, '#7d8e75', { outline: 0.002 });
  // curled body, head and tail
  local.sphere(0, 0.135, -0.02, 0.13, cream, { seg: 10, rings: 7, scaleX: 1.2, scaleY: 0.8, scaleZ: 1.4, outline: 0.006 });
  local.sphere(0.0, 0.17, 0.12, 0.083, cream, { seg: 10, rings: 7, outline: 0.005 });
  local.sphere(0.045, 0.205, 0.14, 0.055, ginger, { seg: 8, rings: 5, scaleX: 1.2, scaleY: 0.8, scaleZ: 0.9, outline: 0.003 });
  // ears
  local.cylinder(-0.055, 0.252, 0.12, 0.002, 0.045, 0.075, 4, cream, { rx: 0.15, rz: -0.2, outline: 0.002 });

  // tail curling around the body
  local.tube([[0.09, 0.09, -0.16], [0.18, 0.075, -0.06], [0.14, 0.07, 0.06], [0.05, 0.08, 0.11]], 0.018, '#a66b49', { sides: 4, outline: 0.003 });
  // front paws and a dark patch.
  local.sphere(-0.055, 0.075, 0.18, 0.035, cream, { seg: 7, rings: 4, scaleY: 0.7, outline: 0.002 });
  local.sphere(0.055, 0.075, 0.18, 0.035, cream, { seg: 7, rings: 4, scaleY: 0.7, outline: 0.002 });

  local.sphere(-0.035, 0.185, 0.19, 0.016, '#d7ef9b', { seg: 6, rings: 4, emit: 0.95, outline: 0 });
  local.sphere(0, 0.16, 0.2, 0.012, pink, { seg: 5, rings: 4, outline: 0 });

/* ---------------------------------------------------------------------------
   A compact city bicycle. Authored in local coordinates, placed via transform.
--------------------------------------------------------------------------- */
function makeBicycle(frameColor = '#e5d9b9', accent = '#30585a', basket = true, secondSeat = false) {
  const m = new MeshBuilder();
  const tire = '#202a2d';
  const rim = '#aab6b4';
  const steel = '#b6bcb6';
  const steelDark = '#6d7978';
  const seat = '#3c352f';
  const y0 = 0.35;
  const R = 0.335;
  const frontZ = 0.63, rearZ = -0.6;

  // Wheels, rims, spokes and hubs.
  for (const wz of [frontZ, rearZ]) {
    m.torus(0, y0, wz, R, 0.023, tire, { ry: PI / 2, seg: 20, tubeSeg: 5, outline: 0.006 });
    m.torus(0, y0, wz, R * 0.84, 0.011, rim, { ry: PI / 2, seg: 20, tubeSeg: 4, outline: 0.002 });
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * TAU;
      m.tube([[0, y0, wz], [0, y0 + Math.sin(a) * R * 0.83, wz + Math.cos(a) * R * 0.83]], 0.004, steel, { sides: 3, outline: 0 });
    }
    m.cylinder(0, y0, wz, 0.034, 0.034, 0.16, 8, steelDark, { rz: PI / 2, outline: 0.003 });
    m.cylinder(0, y0, wz, 0.018, 0.018, 0.18, 7, '#e6e6d6', { rz: PI / 2, outline: 0 });
  }

  // Frame triangle.
  const rearHub = [0, y0, rearZ];
  const bb = [0, 0.36, -0.03];
  const seatBase = [0, 0.78, -0.22];
  const headLow = [0, 0.64, 0.36];
  const headHigh = [0, 0.9, 0.38];
  const frontHub = [0, y0, frontZ];
  const pt = (p) => p;
  m.tube([rearHub, bb], 0.018, frameColor, { sides: 5, outline: 0.004 });
  m.tube([rearHub, seatBase], 0.017, frameColor, { sides: 5, outline: 0.004 });
  m.tube([bb, seatBase], 0.019, frameColor, { sides: 5, outline: 0.004 });
  m.tube([bb, headLow], 0.021, frameColor, { sides: 5, outline: 0.004 });
  m.tube([seatBase, headHigh], 0.017, frameColor, { sides: 5, outline: 0.004 });
  m.tube([headLow, headHigh], 0.026, frameColor, { sides: 6, outline: 0.004 });
  m.tube([headHigh, frontHub], 0.014, frameColor, { sides: 4, outline: 0.004 });
  m.tube([headLow, [0, 0.48, 0.45], frontHub], 0.012, frameColor, { sides: 4, outline: 0.004 });
  // Rear triangle brace.
  m.tube([bb, [0, 0.63, 0.05], seatBase], 0.011, accent, { sides: 4, outline: 0.002 });

  // Fenders: softly arched tubes in the wheel plane.
  function fender(wz) {
    const pts = [];
    for (let i = 0; i <= 9; i++) {
      const a = -0.15 + (i / 9) * (PI + 0.3);
      pts.push([0, y0 + Math.sin(a) * R * 1.05, wz + Math.cos(a) * R * 1.05]);
    }
    m.tube(pts, 0.015, frameColor, { sides: 4, outline: 0.003 });
    const pts2 = pts.map((p) => [p[0] + 0.02, p[1], p[2]]);
    m.tube(pts2, 0.008, steel, { sides: 3, outline: 0 });
  }
  fender(frontZ);
  fender(rearZ);

  // Seat post, saddle, rear rack.
  m.cylinder(0, 0.91, -0.22, 0.016, 0.016, 0.22, 7, steelDark, { outline: 0.002 });
  m.box(0, 0.99, -0.25, 0.16, 0.055, 0.28, seat, { outline: 0.007 });

  m.tube([[0, 0.76, -0.36], [0.14, 0.67, -0.44], [0.14, 0.76, -0.7]], 0.009, steelDark, { sides: 3, outline: 0 });
  m.tube([[0, 0.76, -0.36], [-0.14, 0.67, -0.44], [-0.14, 0.76, -0.7]], 0.009, steelDark, { sides: 3, outline: 0 });

  // Handlebar and stem.
  m.cylinder(0, 0.96, 0.41, 0.018, 0.018, 0.18, 7, steelDark, { outline: 0.002 });
  m.tube([[-0.23, 1.04, 0.43], [0, 1.045, 0.43], [0.23, 1.04, 0.43]], 0.017, steel, { sides: 5, outline: 0.004 });
  m.cylinder(-0.23, 1.04, 0.43, 0.023, 0.023, 0.11, 6, '#2c3333', { rz: PI / 2, outline: 0.002 });
  m.cylinder(0.23, 1.04, 0.43, 0.023, 0.023, 0.11, 6, '#2c3333', { rz: PI / 2, outline: 0.002 });
  m.sphere(0.08, 1.06, 0.38, 0.035, steel, { seg: 7, rings: 4, outline: 0.002 });

  // Front basket, wire construction.
  if (basket) {
    const bx = 0, by = 0.9, bz = 0.69;

    const corners = [
      [-bw / 2, by, bz - bd / 2], [bw / 2, by, bz - bd / 2], [bw / 2, by, bz + bd / 2], [-bw / 2, by, bz + bd / 2],
      [-bw / 2, by + bh, bz - bd / 2], [bw / 2, by + bh, bz - bd / 2], [bw / 2, by + bh, bz + bd / 2], [-bw / 2, by + bh, bz + bd / 2],
    ];
    for (let i = 0; i < 4; i++) {
      m.tube([corners[i], corners[(i + 1) % 4]], 0.009, steel, { sides: 3, outline: 0.002 });

    }
    for (let i = 1; i < 5; i++) {
      const x = -bw / 2 + (bw / 4) * i;
      m.tube([[x, by + bh, bz - bd / 2], [x, by + bh, bz + bd / 2]], 0.004, steelDark, { sides: 3, outline: 0 });
      m.tube([[x, by, bz + bd / 2], [x, by + bh, bz + bd / 2]], 0.004, steelDark, { sides: 3, outline: 0 });
    }
    m.tube([[0, by, bz - bd / 2], [0, 0.62, 0.55], [0, 0.45, 0.48]], 0.009, steelDark, { sides: 3, outline: 0 });
  }

  // Drivetrain, pedals, kickstand.
  m.cylinder(0, 0.36, -0.03, 0.065, 0.065, 0.02, 10, steelDark, { rz: PI / 2, outline: 0.002 });
  m.torus(0, 0.36, -0.03, 0.065, 0.008, steel, { ry: PI / 2, seg: 16, tubeSeg: 3, outline: 0 });
  m.tube([[0.08, 0.38, -0.03], [0.08, 0.38, -0.58]], 0.006, steelDark, { sides: 3, outline: 0 });
  m.tube([[0.08, 0.34, -0.03], [0.08, 0.34, -0.58]], 0.006, steelDark, { sides: 3, outline: 0 });
  m.tube([[0, 0.36, -0.58], [0.08, 0.34, -0.58]], 0.008, steelDark, { sides: 3, outline: 0 });
  m.cylinder(-0.15, 0.36, -0.03, 0.018, 0.018, 0.25, 5, steel, { rz: PI / 2, outline: 0.002 });

  m.box(0.24, 0.36, -0.03, 0.11, 0.025, 0.09, '#2c3333', { outline: 0.002 });
  m.tube([[0, 0.27, -0.35], [0.1, 0.005, -0.34], [0.12, 0.005, -0.3]], 0.012, steelDark, { sides: 4, outline: 0.002 });
  m.cylinder(0, 0.39, rearZ, 0.05, 0.05, 0.015, 8, '#c7c4b2', { rz: PI / 2, outline: 0 });

  // Optional child seat & extra character.
  if (secondSeat) {
    m.box(0, 1.04, -0.6, 0.32, 0.22, 0.3, '#d7ccb0', { outline: 0.007 });
    m.box(0, 1.16, -0.74, 0.29, 0.16, 0.06, '#d7ccb0', { outline: 0.004 });
    m.box(0, 1.0, -0.44, 0.26, 0.06, 0.09, '#4b4b40', { outline: 0.003 });
    m.tube([[0.11, 0.95, -0.38], [0.15, 0.66, -0.42]], 0.009, steelDark, { sides: 3, outline: 0 });
    m.tube([[-0.11, 0.95, -0.38], [-0.15, 0.66, -0.42]], 0.009, steelDark, { sides: 3, outline: 0 });
  }

  return m;
}

function addBicycle(ctx, x, y, z, yaw, lean, frameColor, accent, basket, secondSeat) {
  const local = makeBicycle(frameColor, accent, basket, secondSeat);
  const m = m4.identity(new Float32Array(16));
  m4.compose(m, x, y, z, 0, yaw, lean, 1, 1, 1);
  ctx.lit.append(local, m);
  addContactShadow(ctx, x, z, 0.55, 0.22, y + 0.012, Math.floor(x * 13 + z * 7), '#263032');
}

/* ---------------------------------------------------------------------------
   Vending machines. The front face is atlas art; the body is real geometry so
   it catches rim light and throws a proper glow onto the wet paving.
--------------------------------------------------------------------------- */
function addVendingMachine(ctx, x, z, texKey, bodyColor, trimColor) {
  const B = ctx.lit;
  const baseY = WORLD.sidewalkY;
  const w = 0.94, h = 1.88, d = 0.72;
  const yc = baseY + h / 2;
  // Foot / plinth and body.
  B.box(x, baseY + 0.055, z, w + 0.04, 0.11, d + 0.02, '#252f30', { outline: 0.008 });
  B.box(x, yc, z, w, h, d, bodyColor, { outline: 0.018 });
  B.box(x, yc + 0.035, z - d / 2 + 0.02, w + 0.01, h - 0.07, 0.06, '#273234', { outline: 0.006 });
  // Rounded-ish corner caps & side trims.
  B.box(x - w / 2 + 0.025, yc, z + d / 2 - 0.02, 0.055, h - 0.04, 0.07, trimColor, { outline: 0.005 });
  B.box(x + w / 2 - 0.025, yc, z + d / 2 - 0.02, 0.055, h - 0.04, 0.07, trimColor, { outline: 0.005 });
  B.box(x, yc + h / 2 - 0.02, z + d / 2 - 0.02, w, 0.06, 0.08, trimColor, { outline: 0.005 });
  const cool = texKey === 'vendingA';
  // Recessed front frame.
  B.box(x, yc + 0.02, z + d / 2 + 0.005, w - 0.09, h - 0.15, 0.02, '#d9ddd2', { outline: 0.003 });
  ctx.labels.label(x, yc + 0.02, z + d / 2 + 0.018, w - 0.10, h - 0.17, '+z', texKey, cool ? '#c3e5e7' : '#f0c8b8', 1);
  // Dispenser slot / coin return / side vents.
  B.box(x - 0.23, baseY + 0.23, z + d / 2 + 0.02, 0.42, 0.12, 0.035, '#1a2225', { outline: 0.006 });
  B.box(x + 0.31, yc - 0.22, z + d / 2 + 0.025, 0.14, 0.26, 0.02, '#3e4c4b', { outline: 0.004 });
  B.box(x + 0.31, yc - 0.22, z + d / 2 + 0.037, 0.10, 0.05, 0.01, '#0f1719', { outline: 0 });
  B.sphere(x + 0.31, yc - 0.36, z + d / 2 + 0.041, 0.016, '#84c3ad', { seg: 6, rings: 4, outline: 0, emit: 0.5 });
  for (let i = 0; i < 6; i++) {
    B.box(x + w / 2 + 0.005, baseY + 0.45 + i * 0.11, z - 0.1, 0.01, 0.05, 0.28, '#566563', { outline: 0 });
  }
  // Side branding stripe.
  B.box(x + w / 2 + 0.006, yc + 0.18, z - 0.03, 0.012, 0.2, 0.44, trimColor, { outline: 0 });
  B.box(x - w / 2 - 0.006, yc + 0.18, z - 0.03, 0.012, 0.2, 0.44, trimColor, { outline: 0 });
  // Small top light and glow.
  B.box(x, yc + h / 2 + 0.015, z + 0.08, w - 0.12, 0.02, 0.18, '#f6f2d8', { outline: 0, emit: 0.45 });
  const glowColor = cool ? '#83ddea' : '#ffb788';
  addGlow(ctx, { pos: [x, yc + 0.06, z + d / 2 + 0.16], size: 1.1, aspect: 1.45, color: glowColor, alpha: 0.22, core: false });
  addGlow(ctx, { pos: [x, yc + 0.02, z + d / 2 + 0.09], size: 0.45, aspect: 1.7, color: glowColor, alpha: 0.15 });
  addLightPool(ctx, { x, z: z + d / 2 + 0.35, w: 1.35, d: 1.0, y: 0.185, color: glowColor, alpha: 0.17 });
  addReflection(ctx, { x, z: z + d / 2 + 0.1, y: 0.185, color: glowColor, width: 0.7, length: 3.8, alpha: 0.16, phase: x * 2.1 });
}

/* ---------------------------------------------------------------------------
   Outdoor AC condenser with fan grill and drip pipe.
--------------------------------------------------------------------------- */
function addACUnit(ctx, x, y, z, ry, scale = 1, bodyColor = '#b1b2a5') {
  const local = new MeshBuilder();
  const w = 0.62 * scale, h = 0.48 * scale, d = 0.30 * scale;
  local.box(0, h / 2, 0, w, h, d, bodyColor, { outline: 0.01 });
  local.box(0, h / 2, d / 2 + 0.008, w - 0.08, h - 0.08, 0.02, '#697572', { outline: 0.004 });
  local.cylinder(0, h * 0.5, d / 2 + 0.022, w * 0.32, w * 0.32, 0.018, 18, '#485650', { rx: PI / 2, outline: 0.003 });
  local.cylinder(0, h * 0.5, d / 2 + 0.032, w * 0.27, w * 0.27, 0.01, 18, '#1e292b', { rx: PI / 2, outline: 0 });
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * TAU + 0.4;
    local.box(Math.cos(a) * w * 0.14, h * 0.5 + Math.sin(a) * h * 0.18, d / 2 + 0.042, w * 0.25, 0.025, 0.012, '#5f6b66', { rz: a, outline: 0 });
  }
  local.box(-w / 2 + 0.035, 0.06, 0, 0.045, 0.012, d + 0.03, '#848a7e', { outline: 0.002 });
  local.tube([[-w / 3, 0, -d * 0.1], [-w / 3, -y + 0.03, -d * 0.1], [-w / 3 - 0.12, -y + 0.02, -d * 0.1 + 0.12]], 0.025 * scale, '#7b827b', { sides: 4, outline: 0.002 });
  appendPlaced(ctx, local, x, y, z, 0, ry, 0);
  // condensation drip
  ctx.drips.push({ x: x + Math.sin(ry) * (-0.1), z: z + Math.cos(ry) * (-0.1), y, drop: y - WORLD.sidewalkY, phase: (x * 5.3 + z) % 1, speed: 0.22 });
}

/* ---------------------------------------------------------------------------
   Utility poles and sagging wires.
--------------------------------------------------------------------------- */
function sagWire(ctx, a, b, sag, radius = 0.012, color = '#313b40') {
  const pts = [];
  const n = 18;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push([
      lerp(a[0], b[0], t),
      lerp(a[1], b[1], t) - Math.sin(t * PI) * sag,
      lerp(a[2], b[2], t),
    ]);
  }
  ctx.lit.tube(pts, radius, color, { sides: 3, outline: 0 });
}

function makeGuardrail(length, capColor = '#d7d8c9') {
  const m = new MeshBuilder();
  const posts = Math.max(2, Math.round(length / 1.15) + 1);
  for (let i = 0; i < posts; i++) {
    const x = -length / 2 + (i * length) / (posts - 1);
    m.cylinder(x, 0.38, 0, 0.045, 0.055, 0.76, 7, '#d2d4c7', { outline: 0.005 });
    m.sphere(x, 0.77, 0, 0.055, capColor, { seg: 7, rings: 4, outline: 0.003 });
    m.cylinder(x, 0.04, 0, 0.075, 0.09, 0.08, 7, '#8b928c', { outline: 0.003 });
  }
  for (const y of [0.33, 0.64]) {
    m.tube([[-length / 2, y, 0], [length / 2, y, 0]], 0.037, '#d7d8ca', { sides: 5, outline: 0.004 });
  }
  for (let i = 0; i < posts - 1; i++) {
    const x = -length / 2 + ((i + 0.5) * length) / (posts - 1);
    m.tube([[x, 0.17, 0], [x, 0.78, 0]], 0.014, '#c3c7bb', { sides: 3, outline: 0 });
  }
  return m;
}
